/* Scoring and tie logic for The Voice Within (Master Package v1.0, §4.3, §5.3, §8, §9.3, §10.4).
   Pure functions; no UI. Keys are stable codes only. */
const Logic = (function () {
  const NEED_CODES = ["S", "C", "A", "R", "L"];
  const VOICE_CODES = ["P", "D", "CMP", "O"];
  const PLAYLIST_BY_NAME = {
    "A Little Room to Breathe": "PL_BREATHE",
    "Let Your Mind Wander": "PL_WANDER",
    "A Softer Place to Land": "PL_SOFTER",
    "Slowly, in Your Own Time": "PL_OWNTIME"
  };
  const PLAYLIST_ORDER = ["PL_BREATHE", "PL_WANDER", "PL_SOFTER", "PL_OWNTIME"];

  function requiredIds(C) {
    return [...C.questions_ch1, ...C.questions_ch2, ...C.dialogue_prompts].map(q => q.id);
  }

  function missing(C, answers) {
    return requiredIds(C).filter(id => !answers || !answers[id]);
  }

  function optionCode(q, optId) {
    const o = q.options.find(o => o.id === optId);
    return o ? o.code : undefined;
  }

  // Chapter scores. Returns null unless every scored question in the chapter is answered.
  function chapterScores(questions, codes, answers) {
    const scores = Object.fromEntries(codes.map(c => [c, 0]));
    for (const q of questions) {
      if (!q.is_scored) continue;               // Ch02 Q06 is excluded
      const a = answers[q.id];
      if (!a) return null;                       // never fill missing answers
      const code = optionCode(q, a);
      if (!codes.includes(code)) throw new Error("Invalid answer " + q.id + ":" + a);
      scores[code] += 1;
    }
    return scores;
  }

  // Exact leaders: every code equal to the maximum. No thresholds, no tie-breaking.
  function leaders(scores, codes) {
    const max = Math.max(...codes.map(c => scores[c]));
    const lead = codes.filter(c => scores[c] === max);
    let state;
    if (lead.length === codes.length) state = "all_equal";
    else if (lead.length === 1) state = "unique";
    else if (lead.length === 2) state = "tie2";
    else state = "tie3plus";
    return { codes: lead, state };
  }

  function playlistsFor(C, needCodes, voiceCodes) {
    if (needCodes.length === 1 && voiceCodes.length === 1) {
      return C.playlist_recommendations[needCodes[0] + "×" + voiceCodes[0]].map(n => PLAYLIST_BY_NAME[n]);
    }
    // §10.4 tie rule: count primaries across the tied combinations, de-duplicate, top two by count.
    const count = Object.fromEntries(PLAYLIST_ORDER.map(p => [p, 0]));
    for (const n of needCodes) for (const v of voiceCodes) {
      count[PLAYLIST_BY_NAME[C.playlist_recommendations[n + "×" + v][0]]] += 1;
    }
    const vals = PLAYLIST_ORDER.map(p => count[p]);
    if (vals.every(x => x === vals[0])) return PLAYLIST_ORDER.slice();
    const sorted = [...vals].sort((a, b) => b - a);
    const threshold = Math.max(sorted[1], 1);
    // Anything tied with the second-highest count is kept: no arbitrary cut.
    return PLAYLIST_ORDER.filter(p => count[p] >= threshold)
      .sort((a, b) => count[b] - count[a] || PLAYLIST_ORDER.indexOf(a) - PLAYLIST_ORDER.indexOf(b));
  }

  function feedbackId(C, answers) {
    const p1 = C.dialogue_prompts[0], p2 = C.dialogue_prompts[1];
    const n = optionCode(p1, answers[p1.id]), v = optionCode(p2, answers[p2.id]);
    if (!n || !v) return null;
    return "REFLECT_" + n + "_" + v;
  }

  // Build the full result record from scores (exposed so impossible score patterns can be tested).
  function fromScores(C, needScores, voiceScores, fbId) {
    const ln = leaders(needScores, NEED_CODES);
    const lv = leaders(voiceScores, VOICE_CODES);
    const unique = ln.state === "unique" && lv.state === "unique";
    let tie_state;
    if (unique) tie_state = "none";
    else if (ln.state === "all_equal" && lv.state === "all_equal") tie_state = "all_equal_both";
    else if (ln.state !== "unique" && lv.state !== "unique") tie_state = "both";
    else if (ln.state !== "unique") tie_state = "needs";
    else tie_state = "voices";
    return {
      complete: true,
      need_scores: needScores,
      voice_scores: voiceScores,
      leading_need_codes: ln.codes,
      leading_voice_codes: lv.codes,
      need_state: ln.state,
      voice_state: lv.state,
      result_code: unique ? ln.codes[0] + "×" + lv.codes[0] : null,
      tie_state,
      dialogue_feedback_id: fbId,
      playlist_ids: playlistsFor(C, ln.codes, lv.codes)
    };
  }

  function compute(C, answers) {
    const miss = missing(C, answers);
    if (miss.length) return { complete: false, missing: miss };
    const ns = chapterScores(C.questions_ch1, NEED_CODES, answers);
    const vs = chapterScores(C.questions_ch2, VOICE_CODES, answers);
    return fromScores(C, ns, vs, feedbackId(C, answers));
  }

  return { NEED_CODES, VOICE_CODES, PLAYLIST_ORDER, requiredIds, missing, chapterScores, leaders, playlistsFor, feedbackId, fromScores, compute };
})();
if (typeof module !== "undefined") module.exports = Logic;

function onePlaylist(r) {

  const idOf = name => S.playlists.find(p => p.name === name).id;
  const combos = tiedCombos(r), count = {};
  combos.forEach(k => { const id = idOf(C.playlist_recommendations[k][0]); count[id] = (count[id] || 0) + 1; });
  const max = Math.max(...Object.values(count)), top = Object.keys(count).filter(k => count[k] === max);
  const cardPick = idOf(C.playlist_recommendations[combos[(st.seed || 0) % combos.length]][0]);

}

}

    const h = ims.length > 1 ? 300 : 380, gap = 40, ws = ims.map(i => i.width / i.height * h); let x = (W - ws.reduce((a, b) => a + b + gap, -gap)) / 2;
    ims.forEach((im, i) => { ctx.drawImage(im, x, Z.bottom - 60 - h, ws[i], h); x += ws[i] + gap; });
  }
  if (kind === "back" && SETTINGS.card.drawIp && !bg) {
    const im = await loadImg(IMG.ip[content.chosenNeed] || IMG.ip.A); if (im) fitImg(ctx, im, W / 2, Z.bottom - 60, 300);
  }
  // small logo, bottom centre
  if (logo) { const w = 240, h = logo.height / logo.width * w; ctx.drawImage(logo, (W - w) / 2, H - 100 - h, w, h); }
  else { ctx.font = `600 26px ${DISP}`; ctx.fillStyle = ink; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText("H U M A N   S P A C E", W / 2, H - 92); }
  return cv;
}
async function paintCover() {
  const custom = await loadImg(IMG.cardCover);
  const { cv, ctx, W, H } = newCanvas();
  if (custom) { ctx.drawImage(custom, 0, 0, W, H); return cv; }
  ctx.fillStyle = "#494221"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(231,217,201,.45)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(56, 56, W - 112, H - 112, 36); ctx.stroke();
  ctx.fillStyle = "#e7d9c9"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = `italic 500 108px ${DISP}`; ctx.fillText("The Voice", W / 2, 470); ctx.fillText("Within", W / 2, 600);
  ctx.font = `italic 500 34px ${DISP}`; ctx.fillStyle = "#f8bc52"; ctx.fillText("✦  Your Reflection Card  ✦", W / 2, 380);
  const ims = (await Promise.all(["C", "S", "A", "R", "L"].map(c => loadImg(IMG.ip[c])))).filter(Boolean);
  const spots = [[250, 1390, 260], [800, 1330, 250], [540, 1560, 300], [190, 1690, 220], [880, 1700, 230]];
  ims.forEach((im, i) => fitImg(ctx, im, spots[i][0], spots[i][1], spots[i][2]));
  ctx.font = `600 26px ${DISP}`; ctx.fillStyle = "#e7d9c9"; ctx.fillText("H U M A N   S P A C E", W / 2, H - 140);

}
const cardCanvases = {}, cardFiles = {};
const inApp = /Line\/|Instagram|FBAN|FBAV|FB_IAB|Messenger|MicroMessenger|Threads|KAKAOTALK/i.test(navigator.userAgent);
const isTouch = matchMedia("(pointer: coarse)").matches;
async function drawCards(r) {
  const c = cardContent(r);
  try { await Promise.race([Promise.all([
    document.fonts.load('700 40px "Noto Serif TC"', "你的內在地圖 ABC"), document.fonts.load('400 30px "Noto Serif TC"', "需求聲音"),
    document.fonts.load('italic 500 30px "Playfair Display"', "Your Inner Map")]), new Promise(res => setTimeout(res, 2500))]); } catch (e) {}
  const [front, back] = await Promise.all([paint("front", c), paint("back", c)]);
  if (st.screen !== "card") return;
  // Scores are never passed to the painters.
  cardCanvases.front = front; cardCanvases.back = back;
  cardImgs.front = front.toDataURL("image/png"); cardImgs.back = back.toDataURL("image/png");
  // Pre-build files so the share sheet can open straight from the tap (iOS needs it inside the gesture)
  for (const k of ["front", "back"]) cardCanvases[k].toBlob(b => { if (b) cardFiles[k] = new File([b], `the-voice-within-${k}.png`, { type: "image/png" }); }, "image/png");
  const im = $("#cardFront"); if (im) im.src = cardImgs.front;
  const vb = $("#viewBtn"); if (vb) vb.disabled = false;
}
function saveCard(kind) {
  if (kind === "current") kind = card.stage === "back" ? "back" : "front";
  if (!cardCanvases[kind]) return;
  // 1) Claude preview: the platform download capability
  if (isPreview()) return previewSave(kind);
  // 2) In-app browsers (LINE / IG / FB) block downloads: show the image to press and hold
  if (inApp) return showHold(kind);
  // 3) Phones & tablets: share sheet with the image file → "Save Image" goes straight to Photos
  const f = cardFiles[kind];
  if (isTouch && f && navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f] }).catch(err => { if (err && err.name !== "AbortError") showHold(kind); });
    return;
  }
  // 4) Desktop browsers: a real file download
  try {
    const url = f ? URL.createObjectURL(f) : cardImgs[kind];
    const a = document.createElement("a"); a.href = url; a.download = `the-voice-within-${kind}.png`; document.body.append(a); a.click(); a.remove();
    if (f) setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (isTouch) setTimeout(() => showHold(kind), 300);   // older iOS may ignore download: offer press-and-hold too
  } catch (e) { showHold(kind); }
}
async function previewSave(kind) {
  if (!downloads) return showHold(kind);
  const blob = await new Promise(res => cardCanvases[kind].toBlob(res, "image/png"));
  try { await downloads.save({ filename: `the-voice-within-${kind}.png`, data: blob }); toast(u().saved); }
  catch (e) { if (e && e.code === "declined") toast(u().declined); else showHold(kind); }
}
function showHold(kind) {
  const old = $("#hold"); if (old) old.remove();
  const d = document.createElement("div"); d.className = "hold"; d.id = "hold"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true");
  d.innerHTML = `<p class="holdtip">${esc(u().holdTip)}</p><img src="${cardImgs[kind]}" alt="${esc(u().card)}"><button class="btn soft" data-act="holdClose">${esc(u().holdClose)}</button>`;
  document.body.append(d);
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-act=holdClose]")) { e.stopPropagation(); d.remove(); } });
}

async function submitKit(e) {
  e.preventDefault();
  const form = e.currentTarget, msg = $("#kitMsg"), email = $("#kitEmail").value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = u().kitInvalid; return; }
  if (isPreview()) { msg.textContent = u().kitPreview; return; }
  $("#kitBtn").disabled = true; msg.textContent = u().kitSending;
  try { await fetch(form.action, { method: "POST", mode: "no-cors", body: new FormData(form) }); msg.textContent = u().kitThanks; form.reset(); track("email_submit"); setTimeout(() => { if (st.screen === "kit") go("thanks", 1); }, 1600); }
  catch (err) { track("email_submit", { method: "new_tab" }); form.target = "_blank"; form.submit(); msg.textContent = u().kitNewTab; }
  finally { $("#kitBtn").disabled = false; }
}

/* ---------- events ---------- */
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }
function clearHash() { if (location.hash) history.replaceState(null, "", location.pathname + location.search); }
function confirmRestart() {
  const d = document.createElement("div"); d.className = "modal"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true");
  d.innerHTML = `<div class="box"><h2 style="margin-top:0">${esc(u().restartQ)}</h2><p>${esc(u().restartBody)}</p><div class="nav"><button class="btn soft" data-m="no">${esc(u().cancel)}</button><span class="grow"></span><button class="btn primary" data-m="yes">${esc(u().confirm)}</button></div></div>`;
  document.body.append(d); d.querySelector("[data-m=no]").focus();
  const close = () => d.remove();
  d.addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (e.target === d || (b && b.dataset.m === "no")) close();
    else if (b && b.dataset.m === "yes") { close(); st = { lang: st.lang, answers: {}, screen: "cover", note: "", from: "cover", seed: Math.floor(Math.random() * 1e6) }; save(); clearHash(); go("cover", -1); } });
  d.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
}
function canNext() { const s = st.screen; return !s.startsWith("q:") || !!st.answers[s.slice(2)]; }

document.addEventListener("click", e => {
  if (e.target.closest("#flip")) return doFlip();
  if (e.target.closest("#cardFront")) { track("card_view"); return openSheet(); }
  const sp = e.target.closest("a.spot"); if (sp) { track("spotify_click", { playlist: sp.dataset.pl || "", link_url: sp.href }); return; }
  const o = e.target.closest(".opt");
  if (o) {
    if (busy) return;
    const qid = o.dataset.q, first = !st.answers[qid];
    st.answers[qid] = o.dataset.opt; save();
    document.querySelectorAll("#page .opt").forEach(b => b.setAttribute("aria-checked", b === o));
    const nb = $("#page [data-act=next]"); if (nb) nb.disabled = false;
    $("#bar").style.width = (L.requiredIds(C).filter(id => st.answers[id]).length / 22 * 100) + "%";
    if (first) { busy = true; setTimeout(() => { busy = false; if (st.screen === "q:" + qid) step(1); }, 420); }
    return;
  }
  const b = e.target.closest("[data-act],[data-go],[data-save]"); if (!b) return;
  if (b.dataset.save) { track("card_download", { side: card.stage === "back" ? "back" : "front" }); return saveCard(b.dataset.save); }
  if (b.dataset.go) return go(b.dataset.go);
  const a = b.dataset.act;
  if (a === "next") { if (!busy && canNext()) { if (st.screen === "cover") track("quiz_start", {}, true); step(1); } }
  else if (a === "prev") step(-1);
  else if (a === "flip") doFlip();
  else if (a === "viewCard") { track("card_view"); openSheet(); }
  else if (a === "closeGo") { closeSheet(); go("listen", 1); }
  else if (a === "resume") track("quiz_resume", {}, true), go(st.from && st.from !== "cover" && st.from !== "backcover" ? st.from : (L.missing(C, st.answers).length ? "q:" + L.missing(C, st.answers)[0] : "map"), 1);
  else if (a === "restart") confirmRestart();
  else if (a === "qaLoad") { const v = $("#preset").value; st.answers = { ...(v[0] === "c" ? PRESETS.combos[v.slice(2)] : PRESETS.cases[+v.slice(2)].answers) }; clearHash(); go("map", 1); }
  else if (a === "qaExit") { clearHash(); render(); }
});
document.addEventListener("input", e => { if (e.target.id === "note") { st.note = e.target.value; save(); } });
document.addEventListener("keydown", e => {
  if (e.target.id === "flip" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return doFlip(); }
  const o = e.target.closest && e.target.closest(".opt"); if (!o || !["ArrowDown", "ArrowUp"].includes(e.key)) return;
  const all = [...document.querySelectorAll("#page .opt")], i = all.indexOf(o), d = e.key === "ArrowDown" ? 1 : -1;
  all[(i + d + all.length) % all.length].focus(); e.preventDefault();
});
let tx = null, ty = null;
$("#book").addEventListener("touchstart", e => { if (e.target.closest("#flip,textarea,select,input,form")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#book").addEventListener("touchend", e => {
  if (tx === null || busy || location.hash === "#qa") return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .7) return;
  if (dx < 0 && canNext() && st.screen !== "cover" && st.screen !== "backcover") step(1);
  else if (dx > 0 && st.screen !== "cover") step(-1);
}, { passive: true });
$("#langBtn").addEventListener("click", () => { st.lang = zh() ? "en" : "zh"; save(); track("language_switch", { to: st.lang }); card.stage = "cover"; card.rot = 0; render(); });
window.addEventListener("hashchange", render);

load(); initAnalytics(); render();
if (st.screen === "cover" && location.hash !== "#qa") track("quiz_view", {}, true);
if (isPreview()) {
  window.claude.use("downloads").then(d => { downloads = d; /* save button in the sheet falls back to "press and hold" when unavailable */ }).catch(() => {});
}
}
