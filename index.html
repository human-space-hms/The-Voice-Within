<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Voice Within</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap">
<style>/*
VOICE: 大人的童書 — warm, unhurried, a little playful; a picture book you read alone.
IDEA: a cloth-bound book on a desk; every screen is a page, turned by hand; ribbons mark chapters.
PICTURE: the page itself; IP characters sit in the cover, chapter openers and the result spread.
COLOUR and TYPE: Human Space brand colours on cream paper; Noto Serif TC + Playfair Display (italic for display).
LAYOUT: one centred page (max 600px) on a desk; folio numbers; stack everything on phones.
*/
:root{
  color-scheme:light dark;
  --desk:light-dark(#ece3d5,#2b2822);
  --paper:#f8f2e9; --paper2:#f2e9dc; --edge:#e7d9c9;
  --ink:#3a3420; --muted:#7a6f58; --rule:#dccdb8;
  --blue:#3b78a0; --sky:#9eb9d0; --olive:#494221; --green:#a7bf7c; --pink:#dd8f88; --sun:#f8bc52; --red:#d43a28;
  --ribbon:var(--sky);
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",Georgia,serif;
  --display:"Playfair Display","Noto Serif TC",Georgia,serif;
  /* Reflection-card image tokens */
  --card-bg:#f8f2e9; --card-ink:#3a3420; --card-muted:#7a6f58; --card-accent:#3b78a0; --card-line:#dccdb8;
  --font:"Noto Serif TC","Playfair Display",Georgia,serif;
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.7 var(--serif);overflow-x:clip;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,textarea,select{font:inherit;color:inherit}
.tools{max-width:560px;margin:0 auto 10px;display:flex;gap:8px;align-items:center}
.tools .grow{flex:1}
.prog{flex:1;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .4s}
.pill{min-height:40px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px}
/* Fixed book page: every page has the same size (2:3; 3:5 on phones); long pages scroll inside */
:root{--ratio:2/3;--ratio-n:.6667}
@media (max-width:540px){:root{--ratio:3/5;--ratio-n:.6}}
.book{width:min(94vw,560px,calc((100dvh - 96px) * var(--ratio-n)));aspect-ratio:var(--ratio);margin:0 auto;position:relative;perspective:2000px}
.page{position:relative;background:linear-gradient(90deg,rgba(73,66,33,.10),rgba(73,66,33,0) 22px),radial-gradient(120% 80% at 50% 0%,var(--paper),var(--paper2));
  border-radius:4px 14px 14px 4px;box-shadow:0 1px 0 var(--edge),0 3px 0 #efe4d5,0 5px 0 var(--edge),0 18px 40px rgba(60,45,20,.18);
  position:absolute;inset:0;overflow:hidden;container-type:inline-size;transform-origin:left center;backface-visibility:hidden}
.page.turn{z-index:3;pointer-events:none}
.pin{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8cqw 8cqw 12cqw 10cqw;display:flex;flex-direction:column}
.pin::-webkit-scrollbar{display:none}
.pin>.grow,.cover>.grow,.opener>.grow{flex:1 1 auto;min-height:2cqw}
.ribbon{position:absolute;top:-6px;right:20px;width:22px;height:74px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.12)}
.folio{position:absolute;left:0;right:0;bottom:0;padding:5cqw 0 3.5cqw;background:linear-gradient(transparent,var(--paper2) 55%);pointer-events:none;text-align:center;font:italic 14px var(--display);color:var(--muted)}
.logo{display:block;margin:0 auto 18px;text-align:center}
.logo img{height:46px;width:auto}
.wordmark{display:inline-block;font:600 13px var(--display);letter-spacing:.32em;color:var(--olive);border-top:1px solid var(--olive);border-bottom:1px solid var(--olive);padding:4px 2px 3px 8px}
.ip{display:grid;place-items:center;margin:18px auto}
.ip img{max-width:100%;height:auto;max-height:240px}
.ip.slot{width:180px;aspect-ratio:1;border:1.5px dashed var(--rule);border-radius:50%;color:var(--muted);font-size:13px;text-align:center;line-height:1.4;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%)}
.ip.small.slot{width:120px}.ip.small img{max-height:150px}
.kicker{font:italic 13px var(--display);color:var(--muted);margin:0}
h1{font:700 clamp(22px,6.2cqw,30px)/1.3 var(--display);margin:.15em 0 .35em;text-wrap:balance;letter-spacing:-.005em}
h1 .zh,.zh{font-family:var(--serif)}
.sub{color:var(--muted);margin:0 0 1em}
h2{font:700 16px/1.45 var(--serif);margin:1.4em 0 .5em;text-wrap:balance}
h3{font:600 13px/1.4 var(--serif);letter-spacing:.06em;color:var(--blue);margin:1.5em 0 .3em}
p{margin:0 0 1em}
.center{text-align:center}
.cover h1{font-size:clamp(38px,11vw,58px);text-align:center;margin-top:.2em}
.cover .sub{text-align:center}
.cover .lede p{text-align:center;max-width:30em;margin-inline:auto}
.meta{text-align:center;font:italic 12.5px var(--display);color:var(--muted);margin:.6em 0 0}
.rule{border:0;border-top:1px solid var(--rule);margin:22px auto;width:60%}
.chapterno{font:italic 500 17cqw/1 var(--display);color:var(--ribbon);text-align:center;margin:4cqw 0 1cqw}
.opener h1{text-align:center}.opener .sub{text-align:center}
.stemkick{font:italic 12.5px var(--display);color:var(--muted);margin:0 0 2px}
.stem{font:600 16px/1.65 var(--serif);margin:.4em 0 .7em;text-wrap:pretty}
.opts{display:grid;gap:2px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:start;padding:9px 2px 10px;min-height:46px;border:0;border-bottom:1px dashed var(--rule);background:none;cursor:pointer;line-height:1.6;font-size:14.5px;-webkit-tap-highlight-color:transparent}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font:italic 13px var(--display);color:var(--muted);margin-top:1px;transition:.2s}
.opt .t{background:linear-gradient(transparent 62%,transparent 62%);transition:background .3s}
.opt[aria-checked=true] .k{background:var(--blue);border-color:var(--blue);color:#fff}
.opt[aria-checked=true] .k::before{content:"✓";font-style:normal}
.opt[aria-checked=true] .k span{display:none}
.opt[aria-checked=true] .t{background:linear-gradient(transparent 58%,rgba(248,188,82,.55) 58%);font-weight:600}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.nav{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:18px;position:sticky;bottom:-1px;z-index:2;background:linear-gradient(rgba(242,233,220,0),var(--paper2) 40%)}
.nav .grow{flex:1}
.btn{min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;cursor:pointer;font:600 13.5px var(--serif);letter-spacing:.04em;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.soft{border-color:var(--rule)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;min-height:40px;cursor:pointer;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;font-size:12.5px;background:rgba(255,255,255,.5)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dims{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.dim{border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:8px;padding:11px 13px;background:rgba(255,255,255,.45)}
.dim .n{font-weight:700;font-size:14.5px}.dim .z{color:var(--muted);font:italic 12.5px var(--display)}
.dim p{margin:.4em 0 0;font-size:13.5px;line-height:1.65}
.quote{font:600 15px/1.7 var(--serif);border-inline-start:3px solid var(--sun);padding:2px 0 2px 14px;margin:.6em 0 1em}
.note{font-size:12.5px;color:var(--muted)}
.flipwrap{perspective:1600px;width:min(72vw,300px);margin:18px auto 8px}
.flip{position:relative;width:100%;aspect-ratio:9/16;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.flip.back{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(60,45,20,.25)}
.flip .face img{width:100%;height:100%;display:block;-webkit-touch-callout:default}
.flip .face.b{transform:rotateY(180deg)}
.flip .face img[src=""],.flip .face img:not([src]){visibility:hidden}
.deal{animation:deal .9s cubic-bezier(.25,.8,.25,1) both}
@keyframes deal{from{transform:translateY(40px) rotate(-6deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
.fliphint{text-align:center;font:italic 14px var(--display);color:var(--muted);margin:6px 0 12px}
.cardbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
textarea{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:8px;padding:12px;background:rgba(255,255,255,.6);font-size:16px;line-height:1.6}
.pl{border-top:1px solid var(--rule);padding:14px 0}
.pl b{display:block;font:italic 700 17px var(--display)}
.status{font-size:12px;color:var(--muted);margin:6px 0 0}
.refs{font-size:12px;line-height:1.6;padding-left:0;list-style:none}
.refs li{margin:0 0 10px}
.refs .u{display:block;color:var(--blue);font-weight:600;font-size:12px}
.lines{display:grid;gap:8px;margin:10px 0}
.line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px dashed var(--rule);padding:6px 0}
.line a{font:700 22px var(--display);color:var(--red);text-decoration:none;white-space:nowrap}
.care{background:rgba(221,143,136,.12);border-radius:10px;padding:13px 15px;margin:10px 0}
.care p:last-child{margin:0}
.sign{text-align:center;font:italic 12.5px var(--display);color:var(--muted);margin:20px 0 0}
.modal{position:fixed;inset:0;background:rgb(40 30 10/.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--paper);border-radius:14px;padding:24px;max-width:380px;width:100%;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
table{border-collapse:collapse;font-size:14px;width:100%}td,th{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:start}
select{min-height:44px;width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff;padding:0 10px;font-size:16px}
.qa{font-family:-apple-system,system-ui,sans-serif}
.foot{max-width:600px;margin:12px auto 0;text-align:center;font:italic 11.5px var(--display);letter-spacing:.03em;color:var(--muted)}
.foot a{color:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .foot,:root:not([data-theme=light]) .tools{color:#d8cfbf}}
:root[data-theme=dark] .foot{color:#d8cfbf}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.deal{animation:none}}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo img{width:26.4cqw;height:auto;display:inline-block}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:2%;margin:14px auto 6px;height:clamp(90px,24vw,130px)}
.cast .ipc{height:100%;width:auto;filter:drop-shadow(0 6px 8px rgba(73,66,33,.15))}
.cast .ipc:nth-child(2){height:112%}.cast .ipc:nth-child(4){height:118%}
.bob{animation:bob 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.iprow{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:12px auto}
.iprow .ipc{height:min(110px,26cqw);width:auto;filter:drop-shadow(0 6px 8px rgba(73,66,33,.15))}
.iprow.big .ipc{height:min(140px,32cqw)}.iprow.small .ipc{height:min(80px,20cqw)}
.kit{border-radius:14px;background:var(--olive);color:var(--paper);padding:20px 18px 16px;margin:4px 0}
.kith{font:italic 500 21px var(--display);margin:0 0 6px;color:var(--paper)}
.kit p{margin:0;font-size:14px;line-height:1.7;opacity:.95}
.kit-form{display:grid;gap:8px;margin-top:14px}
.kit-form input{width:100%;min-height:44px;border-radius:10px;border:0;padding:0 14px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.kitbtn{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.kit-msg{font-size:12.5px!important;min-height:1.2em}
.kit-small{font-size:12.5px!important;opacity:.7!important;margin-top:6px!important}
.pl.main{border:1px solid var(--sun);border-radius:12px;padding:14px 15px;background:rgba(248,188,82,.10);margin:12px 0 8px}
.pl.main p{font-size:13.5px}
.spot{display:inline-flex;align-items:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}

.cover{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%}
.page.is-cover .pin{padding:8cqw 7cqw 6cqw 9cqw}
.cover .logo{margin:0 auto 5cqw}
.ctitle{font:italic 500 9.8cqw/1.1 var(--display)!important;color:#c4673f;white-space:nowrap;margin:0 0 2.4cqw!important;letter-spacing:-.01em;text-align:center}
.csub{font:600 4.1cqw/1.4 var(--serif);letter-spacing:.08em;margin:1cqw 0 0;color:var(--ink)}
:lang(en) .csub{font:italic 500 4.8cqw/1.4 var(--display);color:var(--muted)}
.cover .cast{height:22.8cqw;margin:0 auto;gap:0}
.lede{margin-bottom:5cqw}.lede p{margin:0 0 2.4cqw;white-space:nowrap;font-size:3.7cqw;line-height:1.8;color:var(--ink)}
.lede.en p{font:italic 400 3.55cqw/1.7 var(--display);color:var(--ink)}
.cbtns{display:grid;gap:2.6cqw;width:100%}
.cbtns .btn{width:100%;min-height:42px}
.crow{display:flex;gap:2.6cqw}.crow .btn{flex:1;padding:0 8px;font-size:13px}
.fine{font-size:max(11px,2.9cqw);color:var(--muted);margin:3cqw 0 0;line-height:1.6}
.btn[disabled].spot{opacity:.45}

/* v1.4 — openers, dialogue, card stage, thanks */
.pin[data-s="cover"] .nav,.pin[data-s="thanks"] .nav{position:static}
.opener{display:flex;flex-direction:column;align-items:center;text-align:center}
.otitle{font:italic 700 6.6cqw/1.25 var(--display)!important;white-space:nowrap;margin:.2em 0 .3em!important;text-align:center}
.otitle.zh{font:700 6.4cqw/1.3 var(--serif)!important;letter-spacing:.06em}
.olede{font-size:3.9cqw;line-height:1.8;color:var(--muted);margin:0}
.olede.zh{white-space:nowrap}
.olede.en{font:italic 3.9cqw/1.6 var(--display);text-wrap:balance}
.ptitle{font:700 18px/1.5 var(--serif)!important;margin:.3em 0 .6em!important}
.ptitle:not(.zh){font:italic 700 20px/1.35 var(--display)!important}
.body{font-size:13.5px;line-height:1.85}
.care.body p{font-size:13.5px}
.cardstage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;padding:3cqw 0 1cqw}
.cardstage .flipwrap{height:100%;width:auto;aspect-ratio:9/16;max-width:100%;margin:0}
.fliphint{text-align:center;font:italic 12.5px var(--display);color:var(--muted);margin:6px 0 8px}
.cardsave{display:flex;justify-content:center}
.cardsave .btn{min-width:150px}
.savehint{text-align:center;font-size:11.5px;color:var(--muted);margin:6px 0 0}
.flip .face{border-radius:12px;box-shadow:0 10px 26px rgba(60,45,20,.22)}
.thanks{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1;padding-top:6cqw}
.thanks .logo{margin-bottom:8cqw}
.tbtns{display:grid;gap:8px;justify-items:center;margin-top:4cqw}
.tbtns .btn{min-width:200px}
.floaters{position:absolute;left:0;right:0;bottom:6cqw;height:46%;pointer-events:none}
.floaters .ipc{position:absolute;width:auto;filter:drop-shadow(0 6px 8px rgba(73,66,33,.15));animation:drift var(--t,6s) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(3px,-9px) rotate(-3deg)}66%{transform:translate(-3px,-4px) rotate(2deg)}}
.page .pin[data-s="thanks"]{overflow:hidden}
@media (prefers-reduced-motion:reduce){.floaters .ipc{animation:none}}

/* v1.5 */
.cover .cast .ipc{height:100%;margin:0 -1.2cqw}
.cover .cast .ipc:nth-child(1){height:96%;transform:translateY(-5cqw)}
.cover .cast .ipc:nth-child(2){height:118%;transform:translateY(2cqw)}
.cover .cast .ipc:nth-child(3){height:84%;transform:translateY(-7cqw)}
.cover .cast .ipc:nth-child(4){height:122%;transform:translateY(1cqw)}
.cover .cast .ipc:nth-child(5){height:100%;transform:translateY(-3cqw)}
.cover .cast .ipc.bob{animation-name:bob2}
@keyframes bob2{50%{translate:0 -5px;rotate:-1.5deg}}
.opener{flex:1 1 auto;min-height:0}
.iprow.open .ipc{height:min(180px,42cqw)}
.omet{margin:0 0 2px!important}
.pin[data-s="card"] .nav{position:static;margin-top:calc(12cqw + 36px);padding-bottom:8px}
.cardpage{display:flex;flex-direction:column;flex:0 0 100%;height:100%}
.pin[data-s="card"]{padding-top:5cqw}
.cardpage .cardstage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;padding:0}
.cardimg{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:12px;box-shadow:0 12px 28px rgba(60,45,20,.24);cursor:zoom-in;background:var(--paper2)}
.cardimg:not([src]){visibility:hidden}
.cardpage .savehint{margin:12px 0 10px;font-size:12px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(40,32,15,.62);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.sheet-panel{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--paper);border-radius:22px;padding:20px 18px 16px;text-align:center;animation:pop .35s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}}
.sflip{position:relative;height:min(62vh,600px);aspect-ratio:9/16;max-width:100%;margin:0 auto;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.sflip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;box-shadow:0 12px 26px rgba(60,45,20,.25)}
.sflip .face img{width:100%;height:100%;display:block;-webkit-touch-callout:default}
.sflip .face.b{transform:rotateY(180deg)}
.sheet .fliphint{margin:10px 0 12px}
.sheet-btns{display:grid;gap:8px}
.sheet-btns .btn{width:100%}
@media (prefers-reduced-motion:reduce){.sflip{transition:none}.sheet,.sheet-panel{animation:none}}
.closego{height:auto;min-height:44px;padding:8px 14px;line-height:1.4;white-space:normal}
.closego .hl{color:#c4673f;font-weight:700}
.closego .hl{color:var(--sun)}
.btn.soft.closego .hl{color:#c4673f}
.ltitle{font:700 19px/1.5 var(--serif)!important;margin:.3em 0 .5em!important}
.ltitle:not(.zh){font:italic 700 20px/1.35 var(--display)!important}
.lsub{font-size:13px;line-height:1.85;color:var(--muted);margin:0 0 4px}
.pin[data-s="listen"] .pl.main{margin:16px 0 10px}
.pin[data-s="listen"] .pl.main p{font-size:13px;line-height:1.75}
.pin[data-s="listen"] .note{font-size:12px;text-align:center}

const CONTENT = {"questions_ch1": [{"id": "CH1_Q01", "num": "Q01", "title_en": "Waiting for an important result", "stem_zh": "當你正在等待一個重要結果，最希望先得到什麼？", "stem_en": "When you're waiting on an important result, what would you most like to have first?", "options": [{"id": "A", "zh": "知道接下來會發生什麼，心裡比較有底。", "code": "S", "en": "A sense of what happens next, so I feel more grounded."}, {"id": "B", "zh": "有一個熟悉的人可以聊聊，讓自己不必獨自等待。", "code": "C", "en": "Someone familiar to talk to, so I'm not waiting alone."}, {"id": "C", "zh": "能照自己的步調安排生活，不被等待牽著走。", "code": "A", "en": "The freedom to go about my life at my own pace, without the waiting taking over."}, {"id": "D", "zh": "相信自己有能力面對結果，不論最後如何。", "code": "R", "en": "Confidence that I can handle the outcome, whatever it turns out to be."}], "is_scored": true}, {"id": "CH1_Q02", "num": "Q02", "title_en": "Plans suddenly change", "stem_zh": "原本安排好的計畫突然改變，你最希望怎麼做？", "stem_en": "A plan you'd settled on suddenly changes. What would you most want to do?", "options": [{"id": "A", "zh": "找人一起討論新的安排。", "code": "C", "en": "Talk the new arrangements through with someone."}, {"id": "B", "zh": "保留自己的選擇空間，重新決定接下來怎麼做。", "code": "A", "en": "Keep my options open and decide for myself what comes next."}, {"id": "C", "zh": "先弄清楚接下來的步驟，重新找回方向。", "code": "S", "en": "Work out the next steps first, so I can find my bearings again."}, {"id": "D", "zh": "暫時把其他事情放一邊，讓自己喘口氣。", "code": "L", "en": "Set everything else aside for a moment and catch my breath."}], "is_scored": true}, {"id": "CH1_Q03", "num": "Q03", "title_en": "Someone notices you feel low", "stem_zh": "當身邊的人察覺你情緒不太好，你最希望對方怎麼回應？", "stem_en": "When someone close notices you're not feeling great, how would you most like them to respond?", "options": [{"id": "A", "zh": "願意聽我說，不急著給建議。", "code": "C", "en": "Listen to me without rushing to give advice."}, {"id": "B", "zh": "提醒我有能力慢慢處理眼前的事。", "code": "R", "en": "Remind me that I'm capable of working through things in my own time."}, {"id": "C", "zh": "給我一點自己的時間，等我準備好再談。", "code": "A", "en": "Give me some time to myself, and talk when I'm ready."}, {"id": "D", "zh": "協助我整理實際問題，看看下一步能怎麼做。", "code": "S", "en": "Help me sort out the practical side and figure out the next step."}], "is_scored": true}, {"id": "CH1_Q04", "num": "Q04", "title_en": "Feeling left out", "stem_zh": "在熟悉的團體裡，你突然有種被排除在外的感覺。此時你最在意什麼？", "stem_en": "In a group you know well, you suddenly feel left out. What matters most to you in that moment?", "options": [{"id": "A", "zh": "確定自己仍是團體的一份子，不必擔心被排除。", "code": "S", "en": "Knowing I'm still part of the group and don't need to worry about being pushed out."}, {"id": "B", "zh": "有機會表達自己的想法，並且被認真看待。", "code": "R", "en": "Having a chance to share my views and be taken seriously."}, {"id": "C", "zh": "可以自在做自己，不必勉強配合大家。", "code": "A", "en": "Being free to be myself, without forcing myself to fit in."}, {"id": "D", "zh": "能暫時離開這個情境，不必勉強自己繼續參與。", "code": "L", "en": "Being able to step away for a while, without having to keep showing up."}], "is_scored": true}, {"id": "CH1_Q05", "num": "Q05", "title_en": "An important decision is made without you", "stem_zh": "當別人在沒有詢問你的情況下，替你做了重要決定，你最在意什麼？", "stem_en": "Someone makes an important decision for you without asking. What do you care about most?", "options": [{"id": "A", "zh": "自己的意見和想法有被認真看待。", "code": "R", "en": "That my opinions and ideas are taken seriously."}, {"id": "B", "zh": "保有決定是否接受的權利。", "code": "A", "en": "That I keep the right to decide whether to go along with it."}, {"id": "C", "zh": "對方有考慮實際情況，後續不會出現難以預料的問題。", "code": "S", "en": "That they've considered the practical realities, so nothing unexpected comes up later."}, {"id": "D", "zh": "不必立刻承擔所有後續安排，能先喘口氣。", "code": "L", "en": "Not having to take on every follow-up straight away, so I can breathe first."}], "is_scored": true}, {"id": "CH1_Q06", "num": "Q06", "title_en": "Expectations are piling up", "stem_zh": "當工作、生活或別人的期待同時增加，你最希望得到什麼？", "stem_en": "When work, life and other people's expectations all L", "en": "That it's finally over, and I can properly rest."}], "is_scored": true}, {"id": "CH1_Q09", "num": "Q09", "title_en": "A free evening", "stem_zh": "如果今晚突然多出一段完全自由的時間，你最想怎麼使用？", "stem_en": "If you suddenly had a completely free evening tonight, how would you most like to spend it?", "options": [{"id": "A", "zh": "和在乎的人相處，享受彼此陪伴。", "code": "C", "en": "With people I care about, simply enjoying each other's company."}, {"id": "B", "zh": "做一件自己真正想做的事。", "code": "A", "en": "Doing something I genuinely want to do."}, {"id": "C", "zh": "好好休息，讓身心恢復。", "code": "L", "en": "Resting properly and letting body and mind recover."}, {"id": "D", "zh": "做一件讓自己有成就感的事，例如學習或創作。", "code": "R", "en": "Doing something that gives me a sense of accomplishment, like learning or creating."}], "is_scored": true}, {"id": "CH1_Q10", "num": "Q10", "title_en": "Free time, but unfinished tasks remain", "stem_zh": "明明有一段空閒時間，腦中卻一直想到還沒完成的事情。你最希望先確認什麼？", "stem_en": "You have some free time, but your mind keeps drifting to unfinished tasks. What would you most like to be sure of first?", "options": [{"id": "A", "zh": "知道未完成的事情不會造成嚴重後果。", "code": "S", "en": "That leaving things unfinished won't lead to serious consequences."}, {"id": "B", "zh": "有個人可以聊聊，不必一直把事情放在心裡。", "code": "C", "en": "That I have someone to talk to, so I'm not keeping it all to myself."}, {"id": "C", "zh": "提醒自己已經做得夠多，也有能力處理剩下的事。", "code": "R", "en": "That I've done enough, and I'm capable of handling what's left."}, {"id": "D", "zh": "暫時離開角色與責任，不需要隨時回應任何人。", "code": "L", "en": "That I can step out of my roles for a while, without being on call for anyone."}], "is_scored": true}], "questions_ch2": [{"id": "CH2_Q01", "num": "Q01", "title_en": "Reviewing completed work", "stem_zh": "當一件工作已經完成，你卻又看到幾個可以調整的細節，腦中最容易出現什麼想法？", "stem_en": "A piece of work is done, but you spot a few details you could still adjust. What thought comes up most easily?", "options": [{"id": "A", "zh": "如果當初再仔細一點，結果應該可以更好。", "code": "P", "en": "If I'd been a bit more careful, it could have turned out better."}, {"id": "B", "zh": "我真的有能力把這件事做好嗎？", "code": "D", "en": "Am I actually capable of doing this well?"}, {"id": "C", "zh": "其他人好像都能做得比我更好。", "code": "CMP", "en": "Everyone else seems able to do this better than me."}, {"id": "D", "zh": "再確認一次，確保不會影響其他人接下來的工作。", "code": "O", "en": "Let me check once more, so it doesn't affect anyone else's work."}], "is_scored": true}, {"id": "CH2_Q02", "num": "Q02", "title_en": "Starting an unfamiliar task", "stem_zh": "當你接到一項不熟悉的新任務，最先浮現的想法是？", "stem_en": "When you're handed an unfamiliar new task, what's your first thought?", "options": [{"id": "A", "zh": "先看看其他人通常怎麼做。", "code": "CMP", "en": "Let me see how other people usually do it."}, {"id": "B", "zh": "先想想可能出錯的地方，盡量準備周全。", "code": "P", "en": "Let me think through what could go wrong and prepare as thoroughly as I can."}, {"id": "C", "zh": "我真的有能力完成這件事嗎？", "code": "D", "en": "Can I really pull this off?"}, {"id": "D", "zh": "如果沒有做好，可能會增加其他人的負擔。", "code": "O", "en": "If I don't get this right, it could make things harder for everyone else."}], "is_scored": true}, {"id": "CH2_Q03", "num": "Q03", "title_en": "Receiving mild revision feedback", "stem_zh": "當你收到一個不算嚴重的修改意見，最容易怎麼想？", "stem_en": "When you receive a fairly minor revision note, how are you most likely to think?", "options": [{"id": "A", "zh": "對方是不是覺得我能力不夠？", "code": "D", "en": "Do they think I'm not good enough?"}, {"id": "B", "zh": "其他人遇到類似意見時，通常都怎麼處理？", "code": "CMP", "en": "How do other people usually handle feedback like this?"}, {"id": "C", "zh": "我可以把細節再做得更完整。", "code": "P", "en": "I can make the details even more complete."}, {"id": "D", "zh": "我得趕快調整，不能拖慢其他人的進度。", "code": "O", "en": "I need to fix this quickly so I don't hold anyone else up."}], "is_scored": true}, {"id": "CH2_Q04", "num": "Q04", "title_en": "A disappointing outcome", "stem_zh": "當你花了不少時間準備，最後結果卻不如預期，你最容易怎麼想？", "stem_en": "You spent a lot of time preparing, but the result fell short. What are you most likely to think?", "options": [{"id": "A", "zh": "是不是我高估自己的能力了？", "code": "D", "en": "Did I overestimate what I'm capable of?"}, {"id": "B", "zh": "如果準備得更充分，結果或許可以更好。", "code": "P", "en": "If I'd prepared more thoroughly, it might have gone better."}, {"id": "C", "zh": "其他人可能更知道怎麼處理這種情況。", "code": "CMP", "en": "Other people probably know better how to handle this kind of situation."}, {"id": "D", "zh": "我得把問題補救好，才不會影響其他人。", "code": "O", "en": "I need to repair the damage so it doesn't affect anyone else."}], "is_scored": true}, {"id": "CH2_Q05", "num": "Q05", "title_en": "Receiving praise", "stem_zh": "當你完成一項有挑戰性的工作，並且得到稱讚，你最容易出現什麼反應？", "stem_en": "You complete a challenging piece of work and someone praises it. How are you most likely to react?", "options": [{"id": "A", "zh": "想到那些比自己更出色的人，覺得還有差距。", "code": "CMP", "en": "I think of people who are even better, and feel the gap."}, {"id": "B", "zh": "下次應該還能做得更好。", "code": "P", "en": "Next time, I should be able to do even better."}, {"id": "C", "zh": "有點害羞，想推掉稱讚，心裡卻偷偷開心。", "code": "D", "en": "I feel shy and brush it off, but I'm secretly pleased."}, {"id": "D", "zh": "先確認其他人的需求都處理好了，才能真正放鬆。", "code": "O", "en": "First I make sure everyone else's needs are taken care of; only then can I really relax."}], "is_scored": true}, {"id": "CH2_Q06", "num": "Q06", "title_en": "A friend achieves an important goal", "stem_zh": "當朋友達成一個重要目標，你通常會有什麼感受？", "stem_en": "When a friend reaches an important goal, how do you usually feel?", "options": [{"id": "A", "zh": "為什麼是他做到了，我卻還沒有？", "code": null, "en": "Why did they make it, when I haven't yet?"}, {"id": "B", "zh": "替他開心，同時也開始懷疑自己的進度。", "code": null, "en": "Happy for them, while starting to question my own progress."}, {"id": "C", "zh": "真心替他感到高興，享受這個好消息。", "code": null, "en": "Genuinely glad for them, and enjoying the good news."}, {"id": "D", "zh": "受到鼓舞，也開始思考自己是否想追求類似的目標。", "code": null, "en": "Inspired, and wondering whether I'd like to pursue something similar."}], "is_scored": false}, {"id": "CH2_Q07", "num": "Q07", "title_en": "Seeing good news on social media", "stem_zh": "當社群媒體上充滿別人的好消息與成果，你最容易出現什麼想法？", "stem_en": "When your social feed is full of other people's good news and achievements, what thought comes up most easily?", "options": [{"id": "A", "zh": "看見別人的成就，會開始懷疑自己的努力到底有沒有價值。", "code": "D", "en": "Seeing what others have achieved makes me wonder whether my own effort is worth anything."}, {"id": "B", "zh": "好像每個人都有方向，只有我還不確定自己在做什麼。", "code": "CMP", "en": "Everyone else seems to have a direction; I'm the only one unsure of what I'm doing."}, {"id": "C", "zh": "重新整理自己的生活，讓自己更接近期待中的樣子。", "code": "P", "en": "Time to reorganise my life and get closer to who I expect myself to be."}, {"id": "D", "zh": "大家都很努力，我不能因為自己的步調影響共同的工作。", "code": "O", "en": "Everyone's working hard; I can't let my own pace hold up what we're doing together."}], "is_scored": true}, {"id": "CH2_Q08", "num": "Q08", "title_en": "A teammate misses a deadline", "stem_zh": "如果合作夥伴沒有如期完成原本答應的工作，你通常最容易出現什麼想法？", "stem_en": "When a teammate fails to deliver on time, what thought are you most likely to have?", "options": [{"id": "A", "zh": "明明不是我的工作，最後卻還是得由我來收拾。", "code": "O", "en": "It isn't even my job, but I'll end up being the one who cleans it up."}, {"id": "B", "zh": "是不是我一開始沒有說清楚，才會變成這樣？", "code": "D", "en": "Maybe I didn't explain things clearly enough at the start."}, {"id": "C", "zh": "為什麼其他人好像都比我更懂得處理這些事情？", "code": "CMP", "en": "Why does everyone else seem better at handling this kind of thing than I am?"}, {"id": "D", "zh": "下次我要把細節和標準訂得更清楚，避免再出現這種結果。", "code": "P", "en": "Next time I'll set clearer details and standards, so this doesn't happen again."}], "is_scored": true}, {"id": "CH2_Q09", "num": "Q09", "title_en": "Someone asks for another favor", "stem_zh": "當你已經很忙，卻又有人請你幫忙處理一件事，你最容易怎麼想？", "stem_en": "You're already busy, and someone asks you to help with something else. What are you most likely to think?", "options": [{"id": "A", "zh": "有點煩躁，只想別來找我，但還是會接下。", "code": "O", "en": "I'm irritated and want to be left alone, but I'll still take it on."}, {"id": "B", "zh": "如果我拒絕，對方會不會覺得我不可靠？", "code": "D", "en": "If I say no, will they think I'm unreliable?"}, {"id": "C", "zh": "別人好像都能處理更多，為什麼我已經這麼吃力？", "code": "CMP", "en": "Other people seem to manage so much more—why am I already struggling?"}, {"id": "D", "zh": "我得重新安排時間，讓整體效率再好一點。", "code": "P", "en": "I need to rework my schedule so everything runs more efficiently."}], "is_scored": true}, {"id": "CH2_Q10", "num": "Q10", "title_en": "Unfinished tasks at the end of the day", "stem_zh": "一天結束時，還有幾件事情沒完成，你最容易對自己說什麼？", "stem_en": "At the end of the day, a few things are still unfinished. What are you most likely to tell yourself?", "options": [{"id": "A", "zh": "今天的成果還不夠好，明天得做得更好。", "code": "P", "en": "Today's work wasn't good enough; tomorrow I need to do better."}, {"id": "B", "zh": "為什麼別人好像都能把生活安排得更好？", "code": "CMP", "en": "Why does everyone else seem to manage their lives better?"}, {"id": "C", "zh": "今天的自己已經很棒了，剩下的留給明天吧！", "code": "D", "en": "I did great today—the rest can wait for tomorrow!"}, {"id": "D", "zh": "我得確保不會因為自己而影響到任何人。", "code": "O", "en": "I have to make sure nobody is affected because of me."}], "is_scored": true}], "dialogue_prompts": [{"id": "CH3_P1", "title_en": "What You Need", "stem_zh": "當你感到疲憊時，你最需要的是什麼？", "stem_en": "When you're feeling tired, what do you need most?", "options": [{"id": "A", "zh": "有人願意聽我說，不急著給建議。", "code": "C", "en": "Someone who'll listen without rushing to give advice."}, {"id": "B", "zh": "一段安靜獨處的時間，讓我整理思緒。", "code": "A", "en": "Some quiet time alone to sort through my thoughts."}, {"id": "C", "zh": "有人幫我釐清下一步，整理目前的優先順序。", "code": "S", "en": "Someone to help me work out the next step and sort my priorities."}, {"id": "D", "zh": "一段沒有責任、無須回應任何人的時間。", "code": "L", "en": "Time with no responsibilities and no one to answer to."}]}, {"id": "CH3_P2", "title_en": "What You Tell Yourself", "stem_zh": "當你很累，卻還有事情沒完成時，你可能會對自己說什麼？", "stem_en": "When you're exhausted but still have things left to do, what might you say to yourself?", "options": [{"id": "A", "zh": "沒關係，我盡力了，先休息、明天再安排。", "code": "P", "en": "It's okay, I did my best. Rest now, plan tomorrow."}, {"id": "B", "zh": "是不是我能力不夠，才會覺得這麼吃力？", "code": "D", "en": "Maybe I'm just not capable enough, and that's why this feels so hard."}, {"id": "C", "zh": "別人好像都能兼顧，為什麼我做不到？", "code": "CMP", "en": "Everyone else seems to manage it all—why can't I?"}, {"id": "D", "zh": "如果我現在停下來，其他人可能會受到影響。", "code": "O", "en": "If I stop now, other people might be affected."}]}], "dialogue_feedback": {"REFLECT_C_P": {"id": "REFLECT_C_P", "title_zh": "願意停下來，也希望有人懂你的用心", "observation_zh": "你已經能對自己說「我盡力了」，替今天畫下句點。這時候，你可能也很希望有人理解你一路付出的心力。把明天安排好讓你安心；被理解，則讓這份休息更踏實。", "question_zh": "今天的努力，我想讓誰知道？", "reminder_zh": "你的努力不必等到完美，才值得被看見。", "title_en": "Ready to Pause, and Hoping Someone Understands", "reflection_en": "You can tell yourself you've done enough for today, and that matters. At the same time, you may want someone to recognise how much care you've put in. Planning tomorrow helps you settle; being understood can make the rest feel complete.", "question_en": "Who would I like to know about the effort I made today?", "reminder_en": "Your effort deserves to be seen, even before it's perfect."}, "REFLECT_C_D": {"id": "REFLECT_C_D", "title_zh": "想有人陪伴，卻不確定自己值不值得", "observation_zh": "你可能很需要有人理解自己的感受，但當自我懷疑出現時，又容易擔心自己是不是想太多、太脆弱，或給別人添了麻煩。於是，真正需要支持的時候，反而可能選擇沉默。", "question_zh": "如果我不必擔心自己造成別人的負擔，會想向誰說出心裡的話？", "reminder_zh": "你的感受，不需要先證明合理才能說出口。", "title_en": "Wanting Support, but Wondering If You Deserve It", "reflection_en": "You may want someone to understand what you're going through, yet find yourself questioning whether your feelings are valid or whether you're asking for too much. That doubt can make it harder to reach out when you need connection most.", "question_en": "If I didn't have to worry about being a burden, who would I want to open up to?", "reminder_en": "Your feelings don't have to be justified before you share them."}, "REFLECT_C_CMP": {"id": "REFLECT_C_CMP", "title_zh": "想找到歸屬，卻忍不住比較", "observation_zh": "你可能希望在關係裡感受到接納，但也容易留意別人是否比自己更受歡迎、更被理解，或擁有更多陪伴。當比較出現，原本想靠近別人的心情，可能逐漸變成對自己位置的不安。", "question_zh": "哪些關係讓我不需要和任何人比較，也能自在地做自己？", "reminder_zh": "在重要的關係裡，你不需要爭取自己的位置。", "title_en": "Looking for Belonging, While Measuring Your Place", "reflection_en": "You may want to feel included, yet find yourself noticing who seems more connected, more appreciated, or more at ease with others. Comparison can turn the simple wish to belong into a question about where you stand.", "question_en": "Which relationships let me be myself without comparing myself to anyone?", "reminder_en": "You don't have to compete for a place in a meaningful relationship."}, "REFLECT_C_O": {"id": "REFLECT_C_O", "title_zh": "想被照顧，卻還是先照顧別人", "observation_zh": "當你需要支持時，可能也會下意識想到其他人的處境，擔心自己的停下來會影響別人。即使心裡希望有人分擔，最後仍可能習慣先把別人的事情安排好。", "question_zh": "如果我今天先照顧自己的需要，真的會讓重要的人失去支持嗎？", "reminder_zh": "照顧別人的時候，也可以把自己算進去。", "title_en": "Wanting Care, but Still Putting Everyone Else First", "reflection_en": "You may want someone to look after you for a change, yet quickly find yourself thinking about everyone else's needs. Even when you're running low, the feeling that others depend on you can make it difficult to step back.", "question_en": "If I looked after my own needs first today, would the people I care about really be left without support?", "reminder_en": "You can care for others without leaving yourself out."}, "REFLECT_A_P": {"id": "REFLECT_A_P", "title_zh": "把今天放下，用自己的方式安排明天", "observation_zh": "你懂得在累的時候替自己踩煞車，也習慣用自己的節奏規劃接下來的事。什麼時候休息、怎麼繼續，都由你決定，這份自主感可能正是讓你安心的來源。值得留意的是，明天的計畫是否也留了一點彈性。", "question_zh": "明天的安排裡，有沒有一段時間是完全屬於我自己的？", "reminder_zh": "計畫可以由你決定，也可以為自己保留餘裕。", "title_en": "Setting Today Down, Planning Tomorrow Your Way", "reflection_en": "You know how to put the brakes on when you're tired, and you like to plan what's next at your own pace. Choosing when to rest and how to continue may be what helps you feel at ease. It may help to notice whether tomorrow's plan leaves a little room to breathe.", "question_en": "Is there time in tomorrow's plan that belongs entirely to me?", "reminder_en": "Your plans can be yours and still leave room for ease."}, "REFLECT_A_D": {"id": "REFLECT_A_D", "title_zh": "想自己做決定，卻害怕選錯", "observation_zh": "你可能很重視選擇權，希望人生方向由自己決定。但當自我懷疑出現，即使是自己做出的選擇，也可能讓你反覆思考是不是不夠好、是不是忽略了更好的可能。", "question_zh": "我現在需要更多資訊，還是需要相信自己可以承擔選擇的結果？", "reminder_zh": "一個選擇不必完美，也可以完全屬於你。", "title_en": "Wanting to Choose for Yourself, but Afraid of Getting It Wrong", "reflection_en": "Having the freedom to choose matters to you, but uncertainty can make that freedom feel surprisingly heavy. You may revisit your decisions, wondering whether you missed a better option or made the wrong call.", "question_en": "Do I need more information right now, or do I need to trust that I can live with my choice?", "reminder_en": "A choice doesn't have to be perfect to be yours."}, "REFLECT_A_CMP": {"id": "REFLECT_A_CMP", "title_zh": "想走自己的路，卻一直看著別人的方向", "observation_zh": "你可能希望找到符合自己價值觀的生活方式，但當看見別人似乎已經有了清楚的目標，便容易開始懷疑自己的方向。你想保持獨立，卻也可能不知不覺用別人的進度衡量自己。", "question_zh": "如果暫時不參考任何人的選擇，我真正想往哪裡走？", "reminder_zh": "不必跟著別人的方向，你也能知道自己要往哪裡去。", "title_en": "Finding Your Own Direction, While Watching Everyone Else", "reflection_en": "You want a path that feels genuinely yours, yet other people's choices can become hard to ignore. Their certainty or progress may leave you questioning a direction you once felt good about.", "question_en": "If I set everyone else's choices aside for a moment, where would I really want to go?", "reminder_en": "You don't need to follow someone else's direction to know where you're going."}, "REFLECT_A_O": {"id": "REFLECT_A_O", "title_zh": "想保留自己的空間，卻總覺得責任不能放下", "observation_zh": "你可能希望按照自己的步調安排生活，但當責任感出現，便容易把個人需求往後排。即使已經有想做的事，也可能因為擔心影響別人，而再次選擇先處理大家的事情。", "question_zh": "哪一件事，是我真正想做，卻一直因為別人的需要而延後？", "reminder_zh": "你的責任很重要，你為自己做的選擇也是。", "title_en": "Wanting Space, but Feeling Unable to Step Away", "reflection_en": "You may value independence and personal time, yet find it difficult to protect either when others are counting on you. Your own plans can keep getting pushed aside because there's always something that needs your attention.", "question_en": "What's one thing I genuinely want to do but keep putting off because of other people's needs?", "reminder_en": "Your responsibilities matter, and so do the choices you make for yourself."}, "REFLECT_S_P": {"id": "REFLECT_S_P", "title_zh": "先休息，再把明天安排清楚", "observation_zh": "當事情還沒完成，你可能會透過安排明天的時間找回踏實感。知道下一步在哪裡，讓你比較能安心地停下來。只要計畫不變成另一份壓力，它就能成為你休息時的支撐。", "question_zh": "明天最重要的一件事是什麼？其他的能不能先放著？", "reminder_zh": "今晚不必把明天想得清清楚楚，也能好好休息。", "title_en": "Rest First, Then a Clear Plan for Tomorrow", "reflection_en": "When things are left unfinished, planning tomorrow may be what helps you feel steady. Knowing where the next step is makes it easier to stop for tonight. As long as the plan doesn't become another source of pressure, it can support your rest.", "question_en": "What's the one thing that matters most tomorrow—and can the rest wait?", "reminder_en": "You can rest well tonight without having tomorrow fully figured out."}, "REFLECT_S_D": {"id": "REFLECT_S_D", "title_zh": "想知道自己能不能應付，卻越想越不安", "observation_zh": "面對未知時，你可能容易懷疑自己的應變能力，擔心事情一旦出錯，自己就不知道該怎麼辦。你或許很希望得到明確的答案，讓自己確定不會毫無準備地面對接下來的事。", "question_zh": "過去有哪些經驗，能證明我其實曾經好好處理過不確定的情況？", "reminder_zh": "你曾經走過不確定的時刻，那些經驗一直都在。", "title_en": "Wondering If You'll Be Able to Handle What's Next", "reflection_en": "Uncertainty may lead you to question your ability to cope. You might look for reassurance or a clear plan because facing the unknown can feel especially difficult when you're not sure what resources you'll have.", "question_en": "What past experiences show that I've handled uncertainty well before?", "reminder_en": "You've handled uncertain moments before. You can draw on that experience again."}, "REFLECT_S_CMP": {"id": "REFLECT_S_CMP", "title_zh": "想找到可靠的方向，卻不斷參考別人的答案", "observation_zh": "當你不知道怎麼做，別人的經驗可能讓你感到安心。但如果太依賴外在參照，也可能讓你開始懷疑自己的判斷，覺得別人似乎總能找到更穩妥的選擇。", "question_zh": "我正在尋找有用的資訊，還是希望透過比較找到一個絕對不會出錯的答案？", "reminder_zh": "你可以向別人學習，也依然相信自己的判斷。", "title_en": "Looking for a Safe Direction in Other People's Choices", "reflection_en": "Other people's experiences can offer useful guidance when you're unsure. But if you rely too heavily on them, you may begin to doubt your own judgment and assume someone else must know the safer way forward.", "question_en": "Am I looking for useful information, or hoping comparison will give me an answer that can't go wrong?", "reminder_en": "You can learn from others and still trust your own judgment."}, "REFLECT_S_O": {"id": "REFLECT_S_O", "title_zh": "想讓一切穩妥，所以習慣自己扛起來", "observation_zh": "你可能透過安排、確認和承擔責任來維持安全感。當事情牽涉到其他人，你或許會覺得自己必須確保每個環節都沒有問題，否則就很難真正放心。", "question_zh": "如果我不再負責每一個細節，哪些事情其實仍然可以順利進行？", "reminder_zh": "你可以讓事情保持穩定，不必獨自扛起每個部分。", "title_en": "Keeping Things Safe by Carrying the Responsibility", "reflection_en": "You may feel more secure when you know everything is taken care of. When other people are involved, you might find yourself checking every detail or taking on extra responsibility to prevent things from going wrong.", "question_en": "If I stopped taking charge of every detail, what would still go smoothly?", "reminder_en": "You can help keep things steady without carrying every part yourself."}, "REFLECT_L_P": {"id": "REFLECT_L_P", "title_zh": "允許自己休息，也是一種好安排", "observation_zh": "你正在練習一件不容易的事：在事情還沒做完時，先讓自己休息。把明天的時間安排好，可能讓你更放心地放下。今晚最重要的，是讓身心真正恢復。", "question_zh": "如果今晚只做一件照顧自己的事，我會選什麼？", "reminder_zh": "休息本身，就是在為明天做準備。", "title_en": "Letting Yourself Rest Is a Good Plan, Too", "reflection_en": "You're practising something that isn't always easy: resting before everything is done. Putting tomorrow in order may help you let go tonight. For now, what matters most is letting your body and mind recover.", "question_en": "If I did just one caring thing for myself tonight, what would it be?", "reminder_en": "Rest is part of getting ready for tomorrow."}, "REFLECT_L_D": {"id": "REFLECT_L_D", "title_zh": "想停下來，卻懷疑自己是不是不夠努力", "observation_zh": "即使已經感到疲憊，你可能仍會懷疑自己是否真的付出了足夠的努力。當自我懷疑與休息需求同時出現，放慢腳步便可能帶來罪惡感，彷彿還需要證明自己值得休息。", "question_zh": "如果我不必先證明自己夠努力，現在最需要的是什麼？", "reminder_zh": "休息之前，你不需要先證明自己有多累。", "title_en": "Wanting to Rest, but Wondering If You've Done Enough", "reflection_en": "Even when you're tired, you may question whether you've worked hard enough to deserve a break. That doubt can make it difficult to stop, leaving you feeling as though you still need to prove something before you can rest.", "question_en": "If I didn't have to prove I'd worked hard enough, what would I need most right now?", "reminder_en": "You don't have to prove you're exhausted before you take a break."}, "REFLECT_L_CMP": {"id": "REFLECT_L_CMP", "title_zh": "想放慢腳步，卻覺得別人都比自己更努力", "observation_zh": "你可能知道自己需要休息，但當看見別人似乎一直在前進，便容易懷疑自己是不是太慢、太鬆懈。別人的生活節奏可能讓你難以判斷，自己真正需要多少休息。", "question_zh": "如果沒有別人的進度作為參照，我會怎麼安排自己的時間與精力？", "reminder_zh": "你的能量，不需要配合任何人的時程。", "title_en": "Wanting to Slow Down, but Feeling Everyone Else Is Ahead", "reflection_en": "You may recognize that you need rest, yet seeing others stay busy can make you question your own pace. Their activity may leave you wondering whether you're slowing down too much, even when your body is asking for a pause.", "question_en": "Without other people's progress as a reference, how would I spend my time and energy?", "reminder_en": "Your energy doesn't need to match anyone else's schedule."}, "REFLECT_L_O": {"id": "REFLECT_L_O", "title_zh": "想休息，卻擔心自己一停下來就會影響別人", "observation_zh": "當你已經很累，可能仍會先想到其他人是否需要協助，或擔心自己的休息會讓事情停擺。即使身體需要喘息，責任感仍可能讓你把自己排在最後。", "question_zh": "有哪些事情可以交給別人處理，讓我不必一直保持待命？", "reminder_zh": "休息，不代表讓任何人失望。", "title_en": "Needing Rest, but Worrying About Everyone Else", "reflection_en": "Even when you're exhausted, you may find yourself thinking about who still needs your help. The idea of stepping away can feel uncomfortable if you worry that things might fall apart or someone else might be left struggling.", "question_en": "What could I hand over to someone else, so I don't have to stay on call?", "reminder_en": "Taking a break doesn't mean letting everyone down."}}, "results": {"S×P": {"code": "S×P", "need": "S", "voice": "P", "result_name_en": "The Careful Planner", "result_name_zh": "謹慎規劃者", "opening_zh": "當事情還不確定，你可能會想先把各種可能性整理清楚。對你來說，有準備、有方向，往往能讓心裡安定一些。", "opening_en": "When things feel uncertain, you may find comfort in getting the details in order. A clear plan can help you feel grounded and ready for what's ahead.", "need_pattern_zh": "安全與穩定對你可能特別重要。清楚的資訊、可預期的安排，以及知道下一步該怎麼做，都能幫助你找回踏實感。", "need_pattern_en": "Security may be especially important to you. Knowing what to expect, having reliable information, and understanding the next step can make a situation feel more manageable.", "voice_pattern_zh": "高標準的內在聲音，可能讓你不斷檢查細節，希望把錯誤降到最低。即使事情已經完成，你也可能還看得到可以再調整的地方。", "voice_pattern_en": "Your inner perfectionist may keep checking, refining, and looking for ways to prevent mistakes. Even when a task is complete, you might still see room for improvement.", "combined_insight_zh": "當你想透過周全準備獲得安心，高標準也可能讓準備沒有終點。值得留意的是，哪些確認真的有幫助，哪些只是讓你暫時不必面對不確定。", "combined_insight_en": "Preparation can give you a sense of steadiness, but high standards can make it hard to know when preparation is enough. It may help to notice when another check is useful—and when it simply postpones uncertainty.", "small_practice_zh": "開始一件事前，先寫下「足以開始」的三個條件。達成後就先往前一步，不必等到所有細節都完美。", "small_practice_en": "Before starting a task, write down three things that would make it ready enough to begin. Once those are in place, take the first step without waiting for every detail to be perfect.", "reflection_question_zh": "如果我允許事情保留一點不確定，現在最重要的一步會是什麼？", "reflection_question_en": "If I allowed a little uncertainty, what would be the most useful next step?"}, "S×D": {"code": "S×D", "need": "S", "voice": "D", "result_name_en": "The Reassurance Seeker", "result_name_zh": "尋求安心者", "opening_zh": "面對未知時，你可能很希望先知道事情會怎麼發展。當答案還不清楚，自我懷疑也可能跟著變得明顯。", "opening_en": "Uncertainty can leave you wanting a clearer picture of what comes next. When the answer isn't available yet, doubts about your own ability may become louder.", "need_pattern_zh": "安全與穩定可能是你當下很在意的需求。明確的資訊、可靠的安排，以及有人協助釐清狀況，都可能讓你比較安心。", "need_pattern_en": "A sense of security may matter deeply to you. Reliable information, a clear plan, or someone who can help you sort through the situation may help you feel steadier.", "voice_pattern_zh": "自我懷疑的聲音容易把不確定解讀成「我可能做不好」。你可能反覆檢查自己的能力，或擔心自己沒有準備好。", "voice_pattern_en": "Your self-doubting voice may turn uncertainty into a question about your capability. You might revisit your decisions or wonder whether you're prepared enough.", "combined_insight_zh": "你想獲得安心，卻可能因為不確定自己能否應付，而更難相信已有的準備。此時可以試著把「我不知道結果」和「我沒有能力處理」分開看。", "combined_insight_en": "You may look for reassurance while also questioning whether you can handle whatever happens. Try separating \"I don't know the outcome\" from \"I won't be able to cope.\"", "small_practice_zh": "寫下目前已知的事、尚未確定的事，以及自己能採取的一個行動。先處理第三項，不必一次解決所有未知。", "small_practice_en": "Make three short lists: what you know, what remains uncertain, and one action you can take now. Start with the action rather than trying to solve every unknown.", "reflection_question_zh": "當我開始懷疑自己時，有哪些過去的經驗能證明我其實有能力應對？", "reflection_question_en": "When self-doubt shows up, what past experience reminds me that I can handle difficult situations?"}, "S×CMP": {"code": "S×CMP", "need": "S", "voice": "CMP", "result_name_en": "The Reference Seeker", "result_name_zh": "尋找參照者", "opening_zh": "當方向不明確時，你可能會先看看別人怎麼做。參考可靠的經驗，能幫助你理解情況，也讓選擇變得比較踏實。", "opening_en": "When the way forward isn't obvious, you may look at how other people have handled a similar situation. A useful reference can make a decision feel less uncertain.", "need_pattern_zh": "安全與穩定可能是你重要的需求。你希望有足夠資訊，知道事情大致會如何發展，也希望自己的決定有可靠依據。", "need_pattern_en": "Security may be a key need for you. You may feel more settled when you have enough information to understand what could happen and why a particular choice makes sense.", "voice_pattern_zh": "比較型的內在聲音，容易把別人的進度、能力或選擇拿來當作自己的標準。當別人看起來更有把握，你可能開始懷疑自己的判斷。", "voice_pattern_en": "Your comparing voice may use other people's progress or decisions as a benchmark. When someone else seems more certain, you might begin to question your own judgment.", "combined_insight_zh": "參考他人的經驗原本可以提供方向，但如果每次都要先確認別人怎麼選，可能會讓你越來越難辨認自己的判斷。", "combined_insight_en": "Other people's experience can be a helpful guide. But if you need to check what everyone else would do before trusting yourself, your own preferences can become harder to hear.", "small_practice_zh": "蒐集完資訊後，先不再增加新的參考案例，寫下自己最在意的兩個條件，再依照它們做一次選擇。", "small_practice_en": "After gathering information, pause before looking for another example. Write down the two things that matter most to you, then make a choice using those criteria.", "reflection_question_zh": "我是在尋找有用的參考，還是在等待別人替我確認答案？", "reflection_question_en": "Am I looking for useful perspective, or waiting for someone else to confirm the answer?"}, "S×O": {"code": "S×O", "need": "S", "voice": "O", "result_name_en": "The Safeguard", "result_name_zh": "守護者", "opening_zh": "你可能很在意事情是否安排妥當，尤其當其他人也受到影響時。把事情照顧好，往往能讓你感到比較安心。", "opening_en": "You may feel most at ease when the important details are taken care of, especially when other people are involved. Keeping things steady can feel like a meaningful responsibility.", "need_pattern_zh": "安全與穩定對你可能很重要。你希望有清楚的安排，也希望重要的人不會因為突發狀況而陷入困難。", "need_pattern_en": "Security may be central to what you need. Clear arrangements and knowing that people won't be left in a difficult position can help you feel settled.", "voice_pattern_zh": "過度承擔的聲音容易讓你覺得，事情必須由自己確認、處理，才算真正放心。即使不是你的責任，也可能忍不住接手。", "voice_pattern_en": "Your over-responsible voice may tell you that you need to check, fix, or manage things before you can relax. You might take ownership even when a task isn't really yours.", "combined_insight_zh": "當你把安全感和「確保所有人都沒事」連在一起，責任就可能越攬越多。可以練習分辨哪些事情需要你參與，哪些事情可以由其他人負責。", "combined_insight_en": "When feeling safe depends on making sure everyone is okay, responsibility can quietly expand. It may help to separate what genuinely needs your involvement from what others can take care of themselves.", "small_practice_zh": "下一次想接手前，先問一句：「這件事目前真正需要我做的是哪一部分？」只承擔那一部分。", "small_practice_en": "Before stepping in, ask: \"Which part of this actually needs me?\" Take responsibility for that part, and leave the rest where it belongs.", "reflection_question_zh": "如果我不必確保每個環節都沒有問題，哪些責任可以重新分配？", "reflection_question_en": "If I didn't have to make every detail work, what responsibilities could be shared?"}, "C×P": {"code": "C×P", "need": "C", "voice": "P", "result_name_en": "The Approval Seeker", "result_name_zh": "尋求認可者", "opening_zh": "你可能很在意重要的人是否理解自己的努力。當付出被看見、想法被認真對待，你會更容易感受到自己與他人的連結。", "opening_en": "It may mean a lot to you when people notice your effort and take your ideas seriously. Being understood can help you feel connected and valued.", "need_pattern_zh": "情感連結可能是你重要的需求。你希望被理解、被接納，也希望自己的付出在關係中有被看見。", "need_pattern_en": "Connection may be an important need. You may want to feel accepted, understood, and seen for the care or effort you bring to a relationship.", "voice_pattern_zh": "高標準的聲音可能讓你不斷想把事情做得更好，期待表現能獲得肯定。當回應不如預期，你可能開始檢查自己哪裡還不夠好。", "voice_pattern_en": "Your inner perfectionist may keep pushing you to do better, hoping that strong performance will bring recognition. When the response is quieter than expected, you might focus on what you could have improved.", "combined_insight_zh": "當認可與表現綁在一起，你可能很難單純享受關係中的支持。值得留意的是，你是否把「被喜歡」和「做得夠好」放在同一個條件裡。", "combined_insight_en": "When recognition becomes tied to performance, it can be hard to simply receive support. Notice whether being liked and doing things well have started to feel like the same requirement.", "small_practice_zh": "今天做完一件事後，先寫下一個自己認可的地方，不急著尋找別人的評價。", "small_practice_en": "After completing something today, name one part of it that you genuinely feel good about before looking for anyone else's reaction.", "reflection_question_zh": "如果今天沒有人稱讚我，我仍然能從自己身上看見哪些值得肯定的地方？", "reflection_question_en": "If nobody praised me today, what could I still appreciate about my own effort?"}, "C×D": {"code": "C×D", "need": "C", "voice": "D", "result_name_en": "The Quiet Seeker", "result_name_zh": "安靜的尋求者", "opening_zh": "你可能渴望有人理解自己，但不一定容易直接說出需要。當心裡出現懷疑，安靜有時會成為保護自己的方式。", "opening_en": "You may want to feel understood, even if saying what you need doesn't always come easily. When doubt creeps in, keeping things to yourself can feel safer.", "need_pattern_zh": "情感連結可能是你在意的需求。你希望有人願意理解自己的感受，讓你知道不必獨自消化所有事情。", "need_pattern_en": "Connection may matter deeply to you. You may want someone who can listen and help you feel that you don't have to process everything alone.", "voice_pattern_zh": "自我懷疑的聲音可能讓你擔心自己說得不夠好、想得太多，或造成別人的負擔。於是你可能先把感受收起來。", "voice_pattern_en": "Your self-doubting voice may make you wonder whether you're being too sensitive, asking for too much, or making things harder for someone else. You might keep your feelings to yourself as a result.", "combined_insight_zh": "你可能同時想靠近別人，又擔心自己的需要不被理解。關係中的安全感有時從一個小小的表達開始，不必一次說完所有事情。", "combined_insight_en": "Part of you may want to reach out, while another part worries about how your needs will be received. Connection can begin with a small, honest sentence; you don't have to explain everything at once.", "small_practice_zh": "找一位相對安心的人，試著用一句話說明此刻的狀態，例如：「我今天有點累，想找人聊聊。」", "small_practice_en": "Choose someone who feels relatively safe and try saying one simple thing about how you're doing: \"I'm a little worn out today. Could we talk?\"", "reflection_question_zh": "如果我不必先整理好所有情緒，現在最想讓誰知道什麼？", "reflection_question_en": "If I didn't have to organize all my feelings first, what would I want someone to know?"}, "C×CMP": {"code": "C×CMP", "need": "C", "voice": "CMP", "result_name_en": "The Belonging Seeker", "result_name_zh": "尋找歸屬者", "opening_zh": "你可能很在意自己在關係中的位置。當感受到接納與陪伴，你比較容易自在；當比較出現，也可能開始懷疑自己是否足夠重要。", "opening_en": "Your place in a relationship may matter a great deal to you. Feeling welcomed and included can help you relax, while comparison may leave you wondering how much you matter.", "need_pattern_zh": "情感連結可能是你重要的需求。你希望在關係裡被接納、被理解，也能自然地成為其中一份子。", "need_pattern_en": "Connection may be one of your strongest needs. You may want to feel accepted, understood, and able to belong without having to perform.", "voice_pattern_zh": "比較型的聲音容易注意別人受到多少關注、擁有什麼樣的關係，並用這些線索衡量自己的位置。", "voice_pattern_en": "Your comparing voice may pay close attention to who gets noticed, who seems close to whom, and what other people appear to have.", "combined_insight_zh": "想知道自己是否被接納很自然，但比較可能讓你忽略那些已經真實存在的連結。可以把注意力帶回讓你感到自在的人與互動。", "combined_insight_en": "Wanting to know that you belong is human. But comparison can make existing connections harder to see. It may help to return your attention to the people and moments where you already feel at ease.", "small_practice_zh": "想到一段關係時，寫下對方曾做過的一件讓你感到被理解的小事。", "small_practice_en": "Think of one relationship and write down a small moment when that person helped you feel understood or included.", "reflection_question_zh": "哪些關係讓我不需要和別人比較，也能安心做自己？", "reflection_question_en": "Which relationships let me feel at home without comparing myself to anyone else?"}, "C×O": {"code": "C×O", "need": "C", "voice": "O", "result_name_en": "The Caregiver", "result_name_zh": "照顧者", "opening_zh": "你可能很習慣留意別人的狀態，也願意在關係中提供支持。當重要的人過得好，你可能也會感到安心。", "opening_en": "You may naturally notice how other people are doing and offer support when they need it. Knowing that people you care about are okay can bring you comfort, too.", "need_pattern_zh": "情感連結可能是你重要的需求。你希望彼此理解、互相支持，並在關係中感受到陪伴。", "need_pattern_en": "Connection may be especially meaningful to you. You may value mutual understanding, support, and the feeling of being there for one another.", "voice_pattern_zh": "過度承擔的聲音可能讓你覺得自己必須照顧好每個人的需要。即使疲憊，也可能先確認別人是否安頓妥當。", "voice_pattern_en": "Your over-responsible voice may tell you that it's your job to make sure everyone is taken care of. Even when you're tired, you might check on others before noticing what you need.", "combined_insight_zh": "照顧別人可以是你表達在乎的方式，但如果總是由你主動承擔，關係中的互相支持可能失去平衡。", "combined_insight_en": "Caring for people can be one way you show love. But when you're always the one who steps in, the balance of support in a relationship can quietly shift.", "small_practice_zh": "當有人需要幫忙時，先確認自己目前能提供的時間與精力，再決定如何回應。", "small_practice_en": "Before agreeing to help, check how much time and energy you actually have. Then choose a response that respects both the other person and you.", "reflection_question_zh": "在我重視的關係裡，有沒有空間讓別人也照顧我？", "reflection_question_en": "In the relationships that matter to me, is there room for someone else to care for me, too?"}, "A×P": {"code": "A×P", "need": "A", "voice": "P", "result_name_en": "The Self-Directed Achiever", "result_name_zh": "自主實踐者", "opening_zh": "你可能很重視自己決定方向，也希望按照認同的方式完成事情。當能掌握選擇權，你通常更容易投入。", "opening_en": "You may feel most engaged when you have room to choose your direction and decide how to get things done. Having ownership over your choices can bring out your best work.", "need_pattern_zh": "自主與空間可能是你重要的需求。你希望有決定權，能依照自己的價值觀與節奏安排生活。", "need_pattern_en": "Autonomy may be a central need. You may value having a say in your life and making decisions that reflect your own priorities and pace.", "voice_pattern_zh": "高標準的聲音可能讓你對自己的選擇也有很高要求。你可能希望每個決定都能帶來理想成果，讓自主逐漸變成壓力。", "voice_pattern_en": "Your inner perfectionist may set demanding standards for the choices you make. You might feel that every decision needs to lead to an excellent outcome.", "combined_insight_zh": "自主讓你有機會走出自己的路，但不必每次都用成果證明選擇正確。過程中的調整也屬於自主的一部分。", "combined_insight_en": "Independence gives you room to shape your own path, but you don't have to prove that every choice was the best one. Adjusting along the way is part of making your own decisions.", "small_practice_zh": "選一件小事，刻意採用「足夠好」而非「最好」的標準完成，觀察自己是否仍能感到滿意。", "small_practice_en": "Choose one small task and aim for \"good enough\" rather than \"the best.\" Notice whether you can still feel satisfied with the result.", "reflection_question_zh": "如果不需要把每個選擇都做到最好，我會怎麼使用自己的自由？", "reflection_question_en": "How would I use my freedom if I didn't have to make every choice perfectly?"}, "A×D": {"code": "A×D", "need": "A", "voice": "D", "result_name_en": "The Hesitant Chooser", "result_name_zh": "謹慎的選擇者", "opening_zh": "你可能很希望由自己決定人生方向，但在真正做選擇時，又容易擔心判斷錯誤。", "opening_en": "You may want to make your own decisions, yet find yourself hesitating when it's time to choose. The freedom to decide can feel complicated when you're worried about getting it wrong.", "need_pattern_zh": "自主與空間對你可能很重要。你希望保有選擇權，不想只是跟著別人的安排前進。", "need_pattern_en": "Autonomy may matter a lot to you. You want room to shape your own direction rather than simply following someone else's plan.", "voice_pattern_zh": "自我懷疑的聲音可能讓你反覆檢查自己的決定，擔心能力不足，或害怕選擇之後才發現有更好的路。", "voice_pattern_en": "Your self-doubting voice may send you back over the same decision, questioning your ability or wondering whether a better option is out there.", "combined_insight_zh": "你想為自己做主，也希望確定自己有能力承擔結果。可以練習把選擇看成一個能持續調整的過程，而非一次定終身的考驗。", "combined_insight_en": "You want ownership of your choices and confidence that you can live with the outcome. It may help to see decisions as adjustable steps rather than once-and-for-all tests.", "small_practice_zh": "對一個低風險決定設定思考期限。時間到了，就選一個目前最符合需求的方案，之後再依實際情況調整。", "small_practice_en": "Set a time limit for one low-stakes decision. When the time is up, choose the option that best fits your needs now; you can adjust later if you learn something new.", "reflection_question_zh": "我需要的是更好的選擇，還是允許自己在選擇後繼續修正？", "reflection_question_en": "Do I need a better choice, or permission to keep adjusting after I choose?"}, "A×CMP": {"code": "A×CMP", "need": "A", "voice": "CMP", "result_name_en": "The Independent Explorer", "result_name_zh": "獨立追尋者", "opening_zh": "你可能希望走出符合自己想法的路，也很在意選擇是否真正出自內心。不過，別人的進度有時仍會讓你重新檢查自己的方向。", "opening_en": "You may want a path that reflects your own values, with enough room to explore and change direction. Still, other people's progress can sometimes make you reconsider where you're headed.", "need_pattern_zh": "自主與空間可能是你重要的需求。你希望能依照自己的價值觀探索，不必完全照著外界期待生活。", "need_pattern_en": "Autonomy may be especially important to you. You want to explore life on your own terms rather than simply meeting outside expectations.", "voice_pattern_zh": "比較型的聲音容易把別人的成果當成衡量標準。即使你原本很清楚自己想要什麼，也可能因為看見別人走得更快而感到動搖。", "voice_pattern_en": "Your comparing voice may use other people's achievements as a measuring stick. Even when you know what matters to you, seeing someone move faster can make you second-guess your direction.", "combined_insight_zh": "追尋自己的路不代表完全不看別人，而是能辨認哪些參考對你有幫助，哪些比較正在把你帶離自己的優先順序。", "combined_insight_en": "Finding your own path doesn't mean ignoring everyone else. It means knowing which perspectives help you and which comparisons pull you away from your own priorities.", "small_practice_zh": "寫下目前最想投入的一件事，以及它對你個人的意義。暫時不寫別人的進度或評價。", "small_practice_en": "Write down one thing you want to spend time on and why it matters to you. Leave other people's timelines and opinions out of the exercise.", "reflection_question_zh": "如果沒有任何人可以比較，我會如何描述自己正在走的這條路？", "reflection_question_en": "If there were no one to compare myself with, how would I describe the path I'm on?"}, "A×O": {"code": "A×O", "need": "A", "voice": "O", "result_name_en": "The Duty-Bound Individual", "result_name_zh": "責任承擔者", "opening_zh": "你可能很重視自主安排生活，但當別人需要幫忙時，也容易把自己的計畫往後放。", "opening_en": "You may value having control over your time, yet find your own plans slipping whenever someone needs help. Your sense of responsibility can make it difficult to protect your space.", "need_pattern_zh": "自主與空間可能是你重要的需求。你希望有時間與餘裕，依照自己的節奏做決定。", "need_pattern_en": "Autonomy may be a key need. You want enough time and flexibility to make choices at your own pace.", "voice_pattern_zh": "過度承擔的聲音可能讓你覺得自己必須隨時待命。當別人的需求出現，你可能很難安心地保留自己的時間。", "voice_pattern_en": "Your over-responsible voice may keep you on standby. When someone else's needs appear, you might feel that your own plans have to wait.", "combined_insight_zh": "你可能同時重視自由與責任，兩者並不必然衝突。關鍵在於，是否每次都由你犧牲自己的安排來維持事情運作。", "combined_insight_en": "Freedom and responsibility can coexist. The question is whether you are repeatedly giving up your own time just to keep everything running.", "small_practice_zh": "在行事曆中先保留一段個人時間。有人提出新需求時，先確認是否真的需要立即處理。", "small_practice_en": "Put a small block of personal time on your calendar first. When a new request comes in, pause and check whether it truly needs an immediate response.", "reflection_question_zh": "哪些責任是我主動選擇承擔的？哪些只是因為我習慣接手？", "reflection_question_en": "Which responsibilities have I chosen, and which ones do I take on simply out of habit?"}, "R×P": {"code": "R×P", "need": "R", "voice": "P", "result_name_en": "The Constant Improver", "result_name_zh": "持續精進者", "opening_zh": "你可能很在意自己的成長，也希望努力能帶來看得見的進步。當你知道自己正在變得更好，通常比較容易感到踏實。", "opening_en": "You may feel energized by learning, improving, and seeing evidence of your progress. Knowing that your effort is building toward something can be deeply satisfying.", "need_pattern_zh": "能力感與自我認同可能是你重要的需求。你希望看見自己的能力、累積成果，也希望努力有意義。", "need_pattern_en": "Competence and recognition may be important to you. You want to see what you're capable of and feel that your effort is making a difference.", "voice_pattern_zh": "高標準的聲音會不斷提醒你還能進步。它能推動你學習，但也可能讓你很少停下來欣賞已經完成的事。", "voice_pattern_en": "Your inner perfectionist keeps pointing to the next improvement. That can support growth, but it may also leave little room to appreciate what you've already done.", "combined_insight_zh": "追求進步可以帶來動力，但如果每個成果都立刻變成下一個標準，滿足感就很難停留。", "combined_insight_en": "Progress can be motivating. But when every achievement immediately becomes the next standard, satisfaction never gets much time to land.", "small_practice_zh": "每完成一個階段，記下三件已經做到的事，再決定下一個改善目標。", "small_practice_en": "At the end of each stage, write down three things you've already accomplished before choosing your next improvement goal.", "reflection_question_zh": "我能不能在繼續成長的同時，也承認現在的自己已經走了一段路？", "reflection_question_en": "Can I keep growing while also recognizing how far I've already come?"}, "R×D": {"code": "R×D", "need": "R", "voice": "D", "result_name_en": "The Self-Questioner", "result_name_zh": "自我質疑者", "opening_zh": "你可能很希望確認自己的努力有價值，也希望知道自己具備完成事情的能力。當結果不如預期，自我懷疑可能特別容易浮現。", "opening_en": "You may want to know that your effort matters and that you have what it takes to do the job. When something goes wrong, doubts about your ability can quickly take over.", "need_pattern_zh": "能力感與自我認同可能是你在意的需求。你希望看見自己的進步，也希望自己的付出能被自己或重要的人認可。", "need_pattern_en": "Competence and recognition may matter to you. You want to see evidence of your progress and feel that your contribution counts.", "voice_pattern_zh": "自我懷疑的聲音容易把一次失誤擴大成對整體能力的質疑。即使有成果，你也可能覺得那只是運氣或別人的客氣。", "voice_pattern_en": "Your self-doubting voice may turn one mistake into a broader judgment about your abilities. Even when something goes well, you might dismiss it as luck or politeness.", "combined_insight_zh": "你想確認自己做得到，卻可能很難把成功真正算在自己身上。試著用具體事實回應腦中的評價，而不是只依賴當下感受。", "combined_insight_en": "You want to trust that you can do things well, but may find it hard to give yourself credit. Try answering your inner verdict with specific evidence rather than relying only on how you feel in the moment.", "small_practice_zh": "記錄一件完成的事，並寫下其中三個由自己投入的具體行動。", "small_practice_en": "Write down one thing you completed and list three concrete actions you personally took to make it happen.", "reflection_question_zh": "如果朋友完成了和我一樣的事，我會如何評價他的能力？", "reflection_question_en": "If a friend had done exactly what I did, how would I describe their ability?"}, "R×CMP": {"code": "R×CMP", "need": "R", "voice": "CMP", "result_name_en": "The Comparative Achiever", "result_name_zh": "相對成就者", "opening_zh": "你可能很在意自己的表現，也容易從周遭人的成果看見新的目標。別人的進步有時能激勵你，有時也可能讓你覺得自己還不夠好。", "opening_en": "Other people's achievements may give you ideas about what is possible. They can also make you more aware of the distance between where you are and where you think you should be.", "need_pattern_zh": "能力感與自我認同可能是你重要的需求。你希望自己的努力能累積成成果，也希望知道自己正在持續進步。", "need_pattern_en": "Competence and recognition may be important to you. You want your effort to lead somewhere and to know that you're making meaningful progress.", "voice_pattern_zh": "比較型的聲音會把他人的成就當成參照。當別人走得更快，你可能忽略自己的進展，轉而專注於差距。", "voice_pattern_en": "Your comparing voice uses other people's results as a reference point. When someone moves faster, you may lose sight of your own progress and focus on the gap.", "combined_insight_zh": "參考別人的表現可以幫助你設定方向，但若價值感完全依賴相對位置，成就很容易變成永遠追不完的賽事。", "combined_insight_en": "Looking at others can help you set goals. But when your sense of worth depends on your relative position, achievement can start to feel like a race with no finish line.", "small_practice_zh": "設定一個只和自己過去狀態比較的指標，例如本週比上週多完成的一小步。", "small_practice_en": "Choose one measure that compares you with your own past—for example, one small step you took this week that you hadn't taken last week.", "reflection_question_zh": "如果不再用別人的成果衡量自己，我會如何定義自己的進步？", "reflection_question_en": "How would I define progress if I stopped measuring myself against other people's results?"}, "R×O": {"code": "R×O", "need": "R", "voice": "O", "result_name_en": "The Indispensable One", "result_name_zh": "不可或缺者", "opening_zh": "你可能很希望自己的付出能真正派上用場，也容易在別人需要時挺身而出。被信任、被依靠，可能讓你感受到自己的價值。", "opening_en": "You may find meaning in being useful and knowing that people can count on you. Stepping in to solve a problem can make your contribution feel tangible.", "need_pattern_zh": "能力感與自我認同可能是你重要的需求。你希望自己的能力能解決問題，也希望努力對身邊的人有實際幫助。", "need_pattern_en": "Competence and recognition may be central to you. You want your abilities to make a real difference and your effort to matter to the people around you.", "voice_pattern_zh": "過度承擔的聲音可能讓你覺得，只有自己把事情處理好，才算有價值。於是你可能很難拒絕，也不容易把工作交出去。", "voice_pattern_en": "Your over-responsible voice may suggest that your value depends on being the person who gets things done. Saying no or handing something over can therefore feel uncomfortable.", "combined_insight_zh": "被需要能帶來成就感，但如果「有用」成為肯定自己的主要方式，休息或求助就可能變得困難。", "combined_insight_en": "Being needed can feel rewarding. But if usefulness becomes your main way of feeling valued, resting or asking for help may start to feel harder than it needs to be.", "small_practice_zh": "選一件可以交接的小任務，清楚說明必要資訊後交給合適的人，不再反覆接手。", "small_practice_en": "Choose one task that can be handed over. Share the essential information with the right person, then resist the urge to take it back.", "reflection_question_zh": "即使今天沒有替任何人解決問題，我還能如何肯定自己的價值？", "reflection_question_en": "How could I value myself today without having to solve a problem for someone else?"}, "L×P": {"code": "L×P", "need": "L", "voice": "P", "result_name_en": "The Rest Postponer", "result_name_zh": "延後休息者", "opening_zh": "你可能知道自己需要休息，但總覺得還有事情可以再做好一點。當標準一直往前移，真正停下來的時間也容易跟著延後。", "opening_en": "You may know you need a break, yet keep noticing one more thing that could be improved. When the finish line keeps moving, rest can keep getting postponed.", "need_pattern_zh": "休息與喘息可能是你重要的需求。你需要有時間恢復精力，暫時離開待辦事項與各種角色。", "need_pattern_en": "Relief may be an important need. You need time to recover your energy and step away from tasks and the roles you carry.", "voice_pattern_zh": "高標準的聲音可能讓你覺得，事情必須完成得夠好，才有資格休息。", "voice_pattern_en": "Your inner perfectionist may make rest feel like something you have to earn by finishing everything to a high standard.", "combined_insight_zh": "你需要喘息，卻可能把休息設成一種獎勵。若完成的標準不斷改變，休息就很難真正到來。", "combined_insight_en": "You need room to recover, but may treat rest as a reward. If the standard for \"finished\" keeps changing, that reward can remain out of reach.", "small_practice_zh": "在今天的行程中先安排一段短暫休息，並把它視為固定行程，不以待辦事項是否清空作為條件。", "small_practice_en": "Schedule a short break today and treat it like a real appointment. Don't make it conditional on clearing your to-do list.", "reflection_question_zh": "如果休息不需要靠完成所有事情換取，我會想怎麼安排今天？", "reflection_question_en": "If I didn't have to earn rest by finishing everything, how would I plan my day?"}, "L×D": {"code": "L×D", "need": "L", "voice": "D", "result_name_en": "The Reluctant Rester", "result_name_zh": "難以安心休息者", "opening_zh": "你可能已經感到疲憊，卻仍會懷疑自己是不是做得不夠。即使有時間休息，也不一定能立刻放下心裡的事情。", "opening_en": "You may already be tired, yet still wonder whether you've done enough to justify stopping. Even when time is available, switching off can take effort.", "need_pattern_zh": "休息與喘息可能是你當下很需要的需求。你需要暫時離開責任，讓身心有機會恢復。", "need_pattern_en": "Relief may be something you need right now. A little distance from responsibilities can give your mind and body room to recover.", "voice_pattern_zh": "自我懷疑的聲音可能讓你覺得自己還不夠努力，或擔心停下來代表能力不足。", "voice_pattern_en": "Your self-doubting voice may tell you that you haven't tried hard enough or that taking a break means you're falling short.", "combined_insight_zh": "你可能同時需要休息，也需要相信自己有資格停下來。休息不必等到完全耗盡才開始。", "combined_insight_en": "You may need rest and permission to believe that you're allowed to take it. A break doesn't have to wait until you've run out of energy.", "small_practice_zh": "選一段 10 分鐘的時間，暫時離開工作與手機。若腦中出現自責，先辨認那是一個想法，不必立刻照著它行動。", "small_practice_en": "Take ten minutes away from work and your phone. If guilt shows up, notice it as a thought rather than an instruction you have to follow.", "reflection_question_zh": "我會對一個和我同樣疲憊的人說什麼？能不能也把這句話留給自己？", "reflection_question_en": "What would I say to someone who felt as tired as I do—and can I offer myself the same kindness?"}, "L×CMP": {"code": "L×CMP", "need": "L", "voice": "CMP", "result_name_en": "The Pace Keeper", "result_name_zh": "步調追尋者", "opening_zh": "你可能知道自己需要放慢速度，但看到別人持續前進時，仍容易懷疑自己是不是落後了。", "opening_en": "You may recognize when you need to slow down, but seeing others keep moving can make you wonder whether you're falling behind.", "need_pattern_zh": "休息與喘息可能是你重要的需求。你需要依照自己的能量安排生活，而不是一直處於追趕狀態。", "need_pattern_en": "Relief may be an important need. You need to organize your life around your own energy rather than feeling as though you're always catching up.", "voice_pattern_zh": "比較型的聲音容易拿別人的工作量、生活進度或成果當作標準，讓你難以判斷自己的節奏是否合適。", "voice_pattern_en": "Your comparing voice may use other people's workloads, milestones, or achievements as a standard, making it harder to know what pace works for you.", "combined_insight_zh": "每個人的條件與能量不同。別人的速度可以提供參考，但不一定適合直接成為你的日常標準。", "combined_insight_en": "Everyone has different circumstances and energy levels. Other people's pace can offer perspective, but it doesn't have to become your everyday benchmark.", "small_practice_zh": "今天選一件事，以自己目前可持續的速度完成，不額外加碼，也不拿別人的進度當作評分。", "small_practice_en": "Choose one task today and complete it at a pace you can sustain. Don't add extra work or use someone else's progress as your scorecard.", "reflection_question_zh": "什麼樣的生活節奏，能讓我持續前進，也保留恢復的空間？", "reflection_question_en": "What pace would let me keep moving while still leaving room to recover?"}, "L×O": {"code": "L×O", "need": "L", "voice": "O", "result_name_en": "The Last One to Rest", "result_name_zh": "最後才休息的人", "opening_zh": "你可能很需要休息，卻常常先確認別人是否都安排好了。當身邊的人還有需求，你可能很難放心地把事情放下。", "opening_en": "You may need a break, but often check that everyone else is taken care of first. When someone still needs something, it can be hard to put your responsibilities down.", "need_pattern_zh": "休息與喘息可能是你重要的需求。你需要一段不必待命、不必回應所有人的時間。", "need_pattern_en": "Relief may be a real need for you. You need time when you're not on call or expected to respond to everyone.", "voice_pattern_zh": "過度承擔的聲音可能讓你覺得自己必須一直在場，否則別人就會受到影響。", "voice_pattern_en": "Your over-responsible voice may tell you that you have to stay available, or someone else will be left dealing with the consequences.", "combined_insight_zh": "你願意負責任，也可能因此把自己的恢復時間排到最後。適度交接與分工，能讓休息不再只能等到所有人都不需要你。", "combined_insight_en": "Your sense of responsibility may keep pushing recovery to the end of the list. Clear handovers and shared tasks can make rest possible before everyone stops needing you.", "small_practice_zh": "休息前，選出一件可以交接或延後的事情，告知相關的人目前的安排，接著給自己一段不待命的時間。", "small_practice_en": "Before taking a break, identify one task that can be handed over or delayed. Let the relevant person know the plan, then give yourself a little time off duty.", "reflection_question_zh": "如果我不必等到所有人都不需要我，什麼時候就可以開始休息？", "reflection_question_en": "When could I begin resting if I didn't have to wait until nobody needed me?"}}, "playlist_recommendations": {"S×P": ["A Little Room to Breathe", "Let Your Mind Wander"], "S×D": ["Let Your Mind Wander", "A Little Room to Breathe"], "S×CMP": ["A Little Room to Breathe", "Slowly, in Your Own Time"], "S×O": ["A Little Room to Breathe", "A Softer Place to Land"], "C×P": ["A Softer Place to Land", "A Little Room to Breathe"], "C×D": ["A Softer Place to Land", "Let Your Mind Wander"], "C×CMP": ["A Softer Place to Land", "Slowly, in Your Own Time"], "C×O": ["A Softer Place to Land", "A Little Room to Breathe"], "A×P": ["Slowly, in Your Own Time", "A Little Room to Breathe"], "A×D": ["Let Your Mind Wander", "Slowly, in Your Own Time"], "A×CMP": ["Slowly, in Your Own Time", "Let Your Mind Wander"], "A×O": ["Slowly, in Your Own Time", "A Softer Place to Land"], "R×P": ["Slowly, in Your Own Time", "Let Your Mind Wander"], "R×D": ["A Softer Place to Land", "Let Your Mind Wander"], "R×CMP": ["Slowly, in Your Own Time", "A Softer Place to Land"], "R×O": ["A Little Room to Breathe", "A Softer Place to Land"], "L×P": ["A Little Room to Breathe", "Slowly, in Your Own Time"], "L×D": ["A Little Room to Breathe", "A Softer Place to Land"], "L×CMP": ["Slowly, in Your Own Time", "A Little Room to Breathe
